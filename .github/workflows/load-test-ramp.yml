name: Ramp production load test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chalktalk-production-vm
  cancel-in-progress: false

jobs:
  load-test:
    if: github.ref == 'refs/heads/main' && github.repository == 'drh-14/ChalkTalk'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 35
    steps:
      - name: Check out exact trusted main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run selected bounded operation
        env:
          MODE: ramp
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_STORAGE_ENDPOINT: ${{ vars.SUPABASE_STORAGE_ENDPOINT }}
          LOAD_TEST_MAX_VUS: ${{ vars.LOAD_TEST_MAX_VUS }}
          LOAD_TEST_STAGE_MINUTES: ${{ vars.LOAD_TEST_STAGE_MINUTES }}
          LOAD_TEST_RAMP_WRITE_ATTEMPTS: ${{ vars.LOAD_TEST_RAMP_WRITE_ATTEMPTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          LOAD_TEST_REPORT_DIR: ${{ runner.temp }}/chalktalk-load-test-sanitized
        run: bash deployment/load-test/actions-run.sh
      - name: Upload sanitized k6 reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-report-${{ github.run_id }}
          path: ${{ runner.temp }}/chalktalk-load-test-sanitized
          if-no-files-found: ignore
          retention-days: 15
