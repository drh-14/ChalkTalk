name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chalktalk
          POSTGRES_USER: chalktalk
          POSTGRES_PASSWORD: chalktalk
        options: >-
          --health-cmd "pg_isready -U chalktalk -d chalktalk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://chalktalk:chalktalk@localhost:5432/chalktalk
      TEST_DATABASE_URL: postgresql://chalktalk:chalktalk@localhost:5432/chalktalk
      AUTH_TOKEN_SECRET: ci-only-auth-token-secret-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare Compose environment
        run: |
          git ls-files --error-unmatch .env.example
          git check-ignore -q .env
          ! git check-ignore -q .env.example
          cp .env.example .env
          mkdir -p .cert
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .cert/localhost-key.pem \
            -out .cert/localhost.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost"

      - name: Validate Compose configuration
        run: docker compose --profile app config --quiet

      - name: Start full Compose profile
        env:
          WEB_PORT: 5174
        run: docker compose --profile app up --build --wait --wait-timeout 120

      - name: Verify HTTPS API proxy and migrations
        env:
          WEB_PORT: 5174
        run: |
          curl --fail --insecure --retry 20 --retry-connrefused https://localhost:${WEB_PORT}/api/health
          docker compose exec -T postgres psql -U chalktalk -d chalktalk -tAc "SELECT count(*) FROM schema_migrations" | grep -qx "2"

      - name: Verify stale application dependencies self-repair
        env:
          WEB_PORT: 5174
        run: |
          docker compose exec -T web sh -c "rm -rf /app/node_modules/jsdom && printf '%s\\n' stale > /app/node_modules/.chalktalk-dependency-fingerprint"
          docker compose --profile app restart web
          docker compose --profile app up --wait --no-deps web
          curl --fail --insecure --retry 20 --retry-connrefused https://localhost:${WEB_PORT}/api/health
          docker compose exec -T web node -e "require.resolve('jsdom')"
          docker compose exec -T web sh -c "! grep -qx stale /app/node_modules/.chalktalk-dependency-fingerprint"
          docker compose exec -T postgres psql -U chalktalk -d chalktalk -tAc "SELECT count(*) FROM schema_migrations" | grep -qx "2"

      - name: Collect Compose logs
        if: always()
        run: docker compose --profile app logs --no-color

      - name: Stop Compose profile
        if: always()
        run: docker compose --profile app down --volumes --remove-orphans
