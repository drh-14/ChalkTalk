name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-ca-trust:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify production Node images load the pinned Supabase CA
        run: bash deployment/production/tests/verify-ca-images.sh

      - name: Verify private production VM and host-network topology
        run: node --test deployment/production/tests/observability.test.mjs deployment/production/tests/vm-metrics.test.mjs deployment/production/tests/load-test.test.mjs deployment/load-test/preflight.test.mjs deployment/load-test/profile.test.mjs deployment/load-test/coverage.test.mjs deployment/load-test/verify-inventory.test.mjs deployment/load-test/sanitize-artifacts.test.mjs

      - name: Verify lifecycle Compose and private Linux evidence mounts
        run: node --test deployment/production/tests/lifecycle.test.mjs

      - name: Verify bounded k6 smoke against a local mock API
        env:
          RUN_K6_INTEGRATION: "1"
        run: node --test deployment/load-test/workload.integration.test.mjs

      - name: Verify running production VM and host-network telemetry
        run: node --test deployment/production/tests/observability.runtime.test.mjs

      - name: Verify API ETags survive local and production gateways
        run: node --test deployment/production/tests/gateway-etags.test.mjs

  supabase-integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Start disposable local Supabase database and Storage
        run: npx supabase start -x gotrue,realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export local-only S3 credentials
        run: |
          s3_key_id=$(npx supabase status -o env | sed -n 's/^S3_PROTOCOL_ACCESS_KEY_ID=//p' | tr -d '"')
          s3_secret=$(npx supabase status -o env | sed -n 's/^S3_PROTOCOL_ACCESS_KEY_SECRET=//p' | tr -d '"')
          test -n "$s3_key_id" && test -n "$s3_secret"
          echo "::add-mask::$s3_key_id"
          echo "::add-mask::$s3_secret"
          printf 'SUPABASE_S3_KEY_ID=%s\nSUPABASE_S3_SECRET=%s\n' "$s3_key_id" "$s3_secret" >> "$GITHUB_ENV"
          echo 'SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres' >> "$GITHUB_ENV"

      - name: Exercise real API, database, and private Storage
        run: node tests/integration/supabase-ci.mjs

      - name: Show isolated stack logs on failure
        if: failure()
        run: docker compose -f deployment/production/compose.ci.yml logs --no-color || true

      - name: Remove isolated API and migration containers
        if: always()
        run: SUPABASE_S3_KEY_ID=cleanup SUPABASE_S3_SECRET=cleanup docker compose -f deployment/production/compose.ci.yml down --volumes --remove-orphans

      - name: Remove disposable local Supabase stack and volumes
        if: always()
        run: npx supabase stop --no-backup

  verify:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: chalktalk
          POSTGRES_USER: chalktalk
          POSTGRES_PASSWORD: chalktalk
        options: >-
          --health-cmd "pg_isready -U chalktalk -d chalktalk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://chalktalk:chalktalk@localhost:5432/chalktalk
      TEST_DATABASE_URL: postgresql://chalktalk:chalktalk@localhost:5432/chalktalk
      TEST_VECTOR_DATABASE_URL: postgresql://chalktalk:chalktalk@localhost:5432/chalktalk
      AUTH_TOKEN_SECRET: ci-only-auth-token-secret-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated S3 fixture for database tests
        env:
          TEST_S3_ENDPOINT: http://127.0.0.1:18333
          TEST_S3_ACCESS_KEY_ID: chalktalk-verify-ci
          TEST_S3_SECRET_ACCESS_KEY: chalktalk-verify-ci-secret
        run: |
          docker run -d --rm --name chalktalk-verify-s3-ci \
            -e AWS_ACCESS_KEY_ID="$TEST_S3_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$TEST_S3_SECRET_ACCESS_KEY" \
            -p 127.0.0.1:18333:8333 chrislusf/seaweedfs:4.48 mini -dir=/data
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 --aws-sigv4 aws:amz:us-east-1:s3 \
              --user "$TEST_S3_ACCESS_KEY_ID:$TEST_S3_SECRET_ACCESS_KEY" \
              "$TEST_S3_ENDPOINT/" > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs chalktalk-verify-s3-ci
          exit 1

      - name: Exercise k6 fixture safety against a separate PostgreSQL instance
        run: |
          docker run -d --rm --name chalktalk-k6-fixture-ci -e POSTGRES_PASSWORD=k6-ci-isolated -p 127.0.0.1:55432:5432 postgres:16
          trap 'docker stop chalktalk-k6-fixture-ci >/dev/null' EXIT
          until docker exec chalktalk-k6-fixture-ci pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
          export TEST_DATABASE_URL='postgresql://postgres:k6-ci-isolated@127.0.0.1:55432/postgres'
          EMAIL_PROVIDER=resend EMAIL_FROM='CI <mail@example.test>' RESEND_API_KEY=synthetic-ci-key DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
          RUN_K6_FIXTURE_INTEGRATION=1 npx vitest run apps/api/src/database/load-test-fixture.integration.test.ts

      - name: Install PDF validator
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Apply migrations
        env:
          EMAIL_PROVIDER: resend
          EMAIL_FROM: CI <mail@example.test>
          RESEND_API_KEY: synthetic-ci-key
        run: npm run db:migrate

      - name: Validate every applicable database suite without skips
        env:
          TEST_S3_ENDPOINT: http://127.0.0.1:18333
          TEST_S3_ACCESS_KEY_ID: chalktalk-verify-ci
          TEST_S3_SECRET_ACCESS_KEY: chalktalk-verify-ci-secret
        run: |
          npx vitest run apps/api/src/database \
            --exclude apps/api/src/database/load-test-fixture.integration.test.ts \
            --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/database-results.json"
          node deployment/local/tests/assert-database-results.mjs "$RUNNER_TEMP/database-results.json"
          node --test deployment/local/tests/database-ci-scope.test.mjs

      - name: Test
        run: npm test

      - name: Test production release script without VM secrets
        run: python3 -m unittest discover -s deployment/production/tests -p 'test_*.py'

      - name: Test bounded Actions claims and secret-safe VM target checks
        run: python3 -m unittest discover -s deployment/load-test -p 'test_*.py'

      - name: Build
        run: npm run build

      - name: Remove isolated S3 fixture
        if: always()
        run: docker rm -f chalktalk-verify-s3-ci 2>/dev/null || true

  compose-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    env:
      TEST_PROJECT_NAME: ct-modular-compose-ci
      TEST_S3_ENDPOINT: http://127.0.0.1:8333
      TEST_S3_ACCESS_KEY_ID: chalktalk-local
      TEST_S3_SECRET_ACCESS_KEY: chalktalk-local-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Prepare Compose environment
        run: |
          git ls-files --error-unmatch deployment/local/.env.example
          git check-ignore -q .env
          ! git check-ignore -q deployment/local/.env.example
          cp deployment/local/.env.example deployment/local/.env
          auth=$(openssl rand -hex 32); metrics=$(openssl rand -hex 32); grafana=$(openssl rand -hex 32)
          sed -i "s/^AUTH_TOKEN_SECRET=.*/AUTH_TOKEN_SECRET=$auth/; s/^METRICS_TOKEN=.*/METRICS_TOKEN=$metrics/; s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=$grafana/; s/^RESEND_API_KEY=.*/RESEND_API_KEY=synthetic-ci-key/" deployment/local/.env
          # Replace rather than append duplicate keys: the operator parser is strict.
          sed -i 's/^WEB_PORT=.*/WEB_PORT=5174/' deployment/local/.env
          printf '\nLOCAL_DATABASE_HOST_PORT=5432\nLOCAL_OBJECT_STORE_HOST_PORT=8333\n' >> deployment/local/.env
          printf 'TEST_GRAFANA_PASSWORD=%s\n' "$grafana" >> "$GITHUB_ENV"
          printf '. "%s/deployment/local/tests/fixture-services.sh"\n' "$PWD" > "$RUNNER_TEMP/local-fixture.sh"
          printf 'BASH_ENV=%s/local-fixture.sh\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Validate default Compose configuration
        run: |
          sh deployment/local/tests/test-default-local-compose.sh
          node --test deployment/local/tests/ci-start.test.mjs deployment/local/tests/mount-snapshot.test.mjs

      - name: Install browser-test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium --only-shell

      - name: Verify modular local startup and real phase boundaries
        run: node --test deployment/local/tests/start.runtime.test.mjs

      - name: Verify legacy PORT startup preflight
        run: sh deployment/local/tests/test-local-legacy-port.sh

      - name: Start local Compose stack
        env:
          WEB_PORT: 5174
        run: node deployment/local/tests/ci-start.mjs --env-file deployment/local/.env --project-name "$TEST_PROJECT_NAME"

      - name: Verify HTTPS API proxy and migrations
        env:
          WEB_PORT: 5174
        run: |
          curl --fail --insecure --retry 20 --retry-connrefused https://localhost:${WEB_PORT}/api/health
          compose ps --services --status running | grep -qx worker
          compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT EXISTS (SELECT 1 FROM schema_migrations WHERE name = '005_text_posts.sql')" | grep -qx t
          compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector')" | grep -qx t
          compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT to_regclass('public.post_embeddings') IS NOT NULL" | grep -qx t
          compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT count(*) FROM courses" | grep -qx 0
          compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT count(*) FROM users" | grep -qx 0

      - name: Guard the isolated browser-test database
        run: |
          node --test tests/browser/fixtures/isolation.test.mjs
          token=$(openssl rand -hex 24)
          echo "E2E_DB_GUARD_TOKEN=$token" >> "$GITHUB_ENV"
          system_identifier=$(compose exec -T postgres \
            psql -U chalktalk -d chalktalk -tA -v ON_ERROR_STOP=1 -c "SELECT system_identifier::text FROM pg_control_system()")
          echo "E2E_DB_SYSTEM_IDENTIFIER=$system_identifier" >> "$GITHUB_ENV"
          compose exec -T postgres \
            psql -U chalktalk -d chalktalk -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE chalktalk_e2e_guard (token text PRIMARY KEY); INSERT INTO chalktalk_e2e_guard VALUES ('$token');"

      - name: Verify Caddy HTTPS routes, WebSocket upgrades, and persistent CA
        env:
          WEB_PORT: 5174
        run: sh deployment/local/tests/test-caddy-gateway.sh

      - name: Verify local gateway in a real browser
        env:
          E2E_CADDY_URL: https://localhost:5174
        run: npx playwright test tests/browser/local-caddy-gateway.spec.mjs --workers=1

      - name: Verify core flows against the real API and database
        env:
          E2E_BASE_URL: https://localhost:5174
          E2E_DATABASE_URL: postgresql://chalktalk:chalktalk@127.0.0.1:5432/chalktalk
        run: npm run test:browser:core

      - name: Upload core browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-browser-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

      - name: Verify two-browser concurrent collaboration
        env:
          E2E_BASE_URL: https://localhost:5174
          E2E_DATABASE_URL: postgresql://chalktalk:chalktalk@127.0.0.1:5432/chalktalk
        run: npx playwright test tests/browser/live-code-session.spec.mjs --workers=1

      - name: Upload collaboration browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-browser-evidence
          path: test-results/
          if-no-files-found: ignore

      - name: Verify local image PDF and OCR tools
        run: |
          for service in api worker; do
            compose exec -T "$service" sh -ec 'command -v qpdf; command -v pdfinfo; command -v pdftotext; command -v pdftoppm; command -v tesseract; tesseract --list-langs | grep -qx eng'
          done

      - name: Verify SeaweedFS object storage
        run: sh deployment/local/tests/test-seaweedfs-s3.sh

      - name: Verify course and discussion file APIs against PostgreSQL and SeaweedFS
        run: |
          compose exec -T api sh -c 'unset EMAIL_PROVIDER EMAIL_FROM RESEND_API_KEY RESEND_API_BASE_URL; NODE_ENV=test METRICS_TOKEN= TEST_DATABASE_URL="$DATABASE_URL" TEST_S3_ENDPOINT="$S3_ENDPOINT" npx vitest run --testTimeout 30000 apps/api/src/http/course-files.integration.test.ts apps/api/src/http/attachments.integration.test.ts apps/api/src/http/attachments.process.integration.test.ts apps/api/src/jobs/worker.integration.test.ts apps/api/src/jobs/process.integration.test.ts apps/api/src/course-files/validate.test.ts apps/api/src/http/resource-text.integration.test.ts apps/api/src/http/resource-text-ocr.integration.test.ts apps/api/src/jobs/extraction.integration.test.ts apps/api/src/resource-text/extract.test.ts apps/api/src/digest/service.integration.test.ts'

      - name: Verify stale application dependencies self-repair
        env:
          WEB_PORT: 5174
        run: |
          compose exec -T web sh -c "rm -rf /app/node_modules/jsdom && printf '%s\\n' stale > /app/node_modules/.chalktalk-dependency-fingerprint"
          compose restart web
          compose up --wait --no-deps web
          curl --fail --insecure --retry 20 --retry-connrefused https://localhost:${WEB_PORT}/api/health
          compose exec -T web node -e "require.resolve('jsdom')"
          compose exec -T web sh -c "! grep -qx stale /app/node_modules/.chalktalk-dependency-fingerprint"
          compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT EXISTS (SELECT 1 FROM schema_migrations WHERE name = '005_text_posts.sql')" | grep -qx t

      - name: Collect Compose logs
        if: always()
        run: compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: compose down --volumes --remove-orphans

  observability-smoke:
    runs-on: ubuntu-26.04
    env:
      TEST_PROJECT_NAME: ct-modular-observability-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Prepare local-only secrets
        run: |
          cp deployment/local/.env.example deployment/local/.env
          auth=$(openssl rand -hex 32); metrics=$(openssl rand -hex 32); grafana=$(openssl rand -hex 32)
          sed -i "s/^AUTH_TOKEN_SECRET=.*/AUTH_TOKEN_SECRET=$auth/; s/^METRICS_TOKEN=.*/METRICS_TOKEN=$metrics/; s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=$grafana/; s/^RESEND_API_KEY=.*/RESEND_API_KEY=synthetic-ci-key/" deployment/local/.env
          printf 'TEST_GRAFANA_PASSWORD=%s\n' "$grafana" >> "$GITHUB_ENV"
          printf '. "%s/deployment/local/tests/fixture-services.sh"\n' "$PWD" > "$RUNNER_TEMP/local-fixture.sh"
          printf 'BASH_ENV=%s/local-fixture.sh\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Validate local Compose stack
        run: node --test deployment/local/tests/start.test.mjs

      - name: Start observability stack
        run: node deployment/local/tests/ci-start.mjs --env-file deployment/local/.env --project-name "$TEST_PROJECT_NAME"

      - name: Exercise VM and host-network freshness, backlog recovery, and log privacy
        run: sh deployment/local/tests/test-observability.sh

      - name: Collect service logs
        if: failure()
        run: compose logs --no-color --tail 200

      - name: Stop observability stack
        if: always()
        run: compose down --volumes --remove-orphans
  answer-browser:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium --only-shell

      - name: Run answer save-only browser scenarios
        run: npm run test:browser:answers

      - name: Run discussion attachment browser scenarios
        run: npm run test:browser:attachments

      - name: Run resource text search browser scenarios
        run: npm run test:browser:resource-search

      - name: Run other mocked-API browser scenarios
        run: npm run test:browser:mocked

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-screenshots
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14

  semantic-search:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: chalktalk
          POSTGRES_USER: chalktalk
          POSTGRES_PASSWORD: chalktalk
        options: >-
          --health-cmd "pg_isready -U chalktalk -d chalktalk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_VECTOR_DATABASE_URL: postgresql://chalktalk:chalktalk@localhost:5432/chalktalk
      AUTH_TOKEN_SECRET: ci-only-auth-token-secret-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify optional semantic index and HTTP search
        run: npx vitest run apps/api/src/semantic/index.integration.test.ts apps/api/src/http/semantic-posts.integration.test.ts
