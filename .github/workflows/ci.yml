name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Start disposable local Supabase database and Storage
        run: npx supabase start -x gotrue,realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export local-only S3 credential
        run: |
          anon_key=$(npx supabase status -o env | sed -n 's/^ANON_KEY=//p' | tr -d '"')
          test -n "$anon_key"
          echo "::add-mask::$anon_key"
          printf 'SUPABASE_ANON_KEY=%s\n' "$anon_key" >> "$GITHUB_ENV"
          echo 'SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres' >> "$GITHUB_ENV"

      - name: Exercise real API, database, and private Storage
        run: node tests/integration/supabase-ci.mjs

      - name: Show isolated stack logs on failure
        if: failure()
        run: docker compose -f deployment/production/compose.ci.yml logs --no-color || true

      - name: Remove isolated API and migration containers
        if: always()
        run: docker compose -f deployment/production/compose.ci.yml down --volumes --remove-orphans || true

      - name: Remove disposable local Supabase stack and volumes
        if: always()
        run: npx supabase stop --no-backup || true

  verify:
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chalktalk
          POSTGRES_USER: chalktalk
          POSTGRES_PASSWORD: chalktalk
        options: >-
          --health-cmd "pg_isready -U chalktalk -d chalktalk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://chalktalk:chalktalk@localhost:5432/chalktalk
      TEST_DATABASE_URL: postgresql://chalktalk:chalktalk@localhost:5432/chalktalk
      AUTH_TOKEN_SECRET: ci-only-auth-token-secret-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF validator
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Test production release script without VM secrets
        run: python3 -m unittest discover -s deployment/production/tests -p 'test_*.py'

      - name: Build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare Compose environment
        run: |
          git ls-files --error-unmatch .env.example
          git check-ignore -q .env
          ! git check-ignore -q .env.example
          cp .env.example .env
          printf "\nRESEND_API_BASE_URL=http://127.0.0.1:9\n" >> .env
          mkdir -p .cert
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .cert/localhost-key.pem \
            -out .cert/localhost.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost"

      - name: Validate Compose configuration
        run: docker compose --profile app config --quiet

      - name: Start full Compose profile
        env:
          WEB_PORT: 5174
        run: docker compose --profile app up --build --wait --wait-timeout 120

      - name: Verify HTTPS API proxy and migrations
        env:
          WEB_PORT: 5174
        run: |
          curl --fail --insecure --retry 20 --retry-connrefused https://localhost:${WEB_PORT}/api/health
          docker compose --profile app ps --services --status running | grep -qx worker
          docker compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT EXISTS (SELECT 1 FROM schema_migrations WHERE name = '005_text_posts.sql')" | grep -qx t
          docker compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector')" | grep -qx t
          docker compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT to_regclass('public.post_embeddings') IS NOT NULL" | grep -qx t
          docker compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT EXISTS (SELECT 1 FROM organizations WHERE domain = 'ams161.mock.chalktalk.invalid')" | grep -qx f

      - name: Verify local image PDF and OCR tools
        run: |
          for service in api worker; do
            docker compose exec -T "$service" sh -ec 'command -v qpdf; command -v pdfinfo; command -v pdftotext; command -v pdftoppm; command -v tesseract; tesseract --list-langs | grep -qx eng'
          done

      - name: Verify SeaweedFS object storage
        run: sh docker/test-seaweedfs-s3.sh

      - name: Verify course and discussion file APIs against PostgreSQL and SeaweedFS
        run: |
          docker compose exec -T api sh -c 'TEST_DATABASE_URL="$DATABASE_URL" TEST_S3_ENDPOINT="$S3_ENDPOINT" npx vitest run --testTimeout 30000 apps/api/src/http/course-files.integration.test.ts apps/api/src/http/attachments.integration.test.ts apps/api/src/http/attachments.process.integration.test.ts apps/api/src/jobs/worker.integration.test.ts apps/api/src/jobs/process.integration.test.ts apps/api/src/course-files/validate.test.ts apps/api/src/http/resource-text.integration.test.ts apps/api/src/http/resource-text-ocr.integration.test.ts apps/api/src/jobs/extraction.integration.test.ts apps/api/src/resource-text/extract.test.ts'

      - name: Verify stale application dependencies self-repair
        env:
          WEB_PORT: 5174
        run: |
          docker compose exec -T web sh -c "rm -rf /app/node_modules/jsdom && printf '%s\\n' stale > /app/node_modules/.chalktalk-dependency-fingerprint"
          docker compose --profile app restart web
          docker compose --profile app up --wait --no-deps web
          curl --fail --insecure --retry 20 --retry-connrefused https://localhost:${WEB_PORT}/api/health
          docker compose exec -T web node -e "require.resolve('jsdom')"
          docker compose exec -T web sh -c "! grep -qx stale /app/node_modules/.chalktalk-dependency-fingerprint"
          docker compose exec -T postgres psql -U chalktalk -d chalktalk -tA -c "SELECT EXISTS (SELECT 1 FROM schema_migrations WHERE name = '005_text_posts.sql')" | grep -qx t

      - name: Collect Compose logs
        if: always()
        run: docker compose --profile app logs --no-color

      - name: Stop Compose profile
        if: always()
        run: docker compose --profile app down --volumes --remove-orphans

  observability-smoke:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare local-only secrets and HTTPS certificate
        run: |
          cp .env.example .env
          printf "\nRESEND_API_BASE_URL=http://127.0.0.1:9\n" >> .env
          cat >> .env <<EOF_CONFIG
          METRICS_TOKEN=$(openssl rand -hex 32)
          GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 32)
          EOF_CONFIG
          mkdir -p .cert
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .cert/localhost-key.pem \
            -out .cert/localhost.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost"

      - name: Validate observability Compose profile
        run: docker compose --profile app --profile observability config --quiet

      - name: Start observability stack
        run: docker compose --profile app --profile observability up --build --wait --wait-timeout 240 --quiet-pull

      - name: Exercise protected metrics, backlog recovery, and log privacy
        run: sh docker/test-observability.sh

      - name: Collect service logs
        if: failure()
        run: docker compose --profile app --profile observability logs --no-color --tail 200

      - name: Stop observability stack
        if: always()
        run: docker compose --profile app --profile observability down --volumes --remove-orphans
  answer-browser:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium --only-shell

      - name: Run answer save-only browser scenarios
        run: npm run test:browser:answers

      - name: Run discussion attachment browser scenarios
        run: npm run test:browser:attachments

      - name: Run resource text search browser scenarios
        run: npm run test:browser:resource-search

      - name: Run other mocked-API browser scenarios
        run: npm run test:browser:mocked

  semantic-search:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: chalktalk
          POSTGRES_USER: chalktalk
          POSTGRES_PASSWORD: chalktalk
        options: >-
          --health-cmd "pg_isready -U chalktalk -d chalktalk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_VECTOR_DATABASE_URL: postgresql://chalktalk:chalktalk@localhost:5432/chalktalk
      AUTH_TOKEN_SECRET: ci-only-auth-token-secret-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify optional semantic index and HTTP search
        run: npx vitest run apps/api/src/semantic/index.integration.test.ts apps/api/src/http/semantic-posts.integration.test.ts
