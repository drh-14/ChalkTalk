input {
  file {
    path => "/var/log/chalktalk/*.ndjson"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/chalktalk.sincedb"
    mode => "tail"
    discover_interval => 2
    stat_interval => 1
    codec => json { ecs_compatibility => disabled }
  }
}
filter {
  if ![event] or ![timestamp] { drop {} }
  date { match => ["timestamp", "ISO8601"] target => "@timestamp" }
  mutate { remove_field => ["host", "path", "@version", "timestamp", "log"] }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "chalktalk-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
