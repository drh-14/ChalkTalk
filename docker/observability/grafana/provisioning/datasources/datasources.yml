apiVersion: 1
datasources:
  - name: Prometheus
    uid: chalktalk-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: ChalkTalk Logs
    uid: chalktalk-logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: chalktalk-logs-*
    jsonData:
      index: chalktalk-logs-*
      timeField: '@timestamp'
      logMessageField: event
      logLevelField: level
      esVersion: '8.0.0'
