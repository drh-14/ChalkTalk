---
openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ChalkTalk API
  version: 1.0.0
  summary: HTTP contract for ChalkTalk clients.
  description: >-
    ChalkTalk course discussion, content, collaboration, and administration API.
    Browser requests use the `__Host-chalktalk_session` cookie. The frontend and
    API use same-site HTTPS custom domains, such as app.example.edu and
    api.example.edu, so the session can retain SameSite=Lax. Credentialed CORS
    responses echo only an exact deployment-configured HTTPS frontend origin,
    include `Vary: Origin` and `Access-Control-Allow-Credentials: true`, and never
    use a wildcard origin. Every unsafe request validates `Origin`; authenticated
    unsafe requests also validate the session-bound `X-CSRF-Token`. Expiring or
    revoking a session invalidates its CSRF token.
    Implementation status: JSON question and note posts, shared student and staff
    answers, question-owned threaded followups, and answer/followup upvotes are live.
    Answer bodies support explicit save-only versioned REST editing; followups and
    replies also use REST only. Saved questions, notes, answers, and followups
    support separate parent-scoped file attachments; create/update text requests
    remain JSON-only. Private post-anchored live sessions are live through the
    collaboration-session routes and the collaboration WebSocket. Polls, multipart
    post create/update, download refresh, and subchannel-anchored collaboration
    sessions remain unavailable.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: "/api/v1"
tags:
  - name: Observability
    description: Local operator-only metrics.
  - name: Authentication
    description: Authentication operations.
  - name: Organizations
    description: Organizations operations.
  - name: Courses
    description: Courses operations.
  - name: Course Memberships
    description: Course Memberships operations.
  - name: Posts
    description: Posts operations.
  - name: Answers
    description: Answers operations.
  - name: Statistics
    description: Statistics operations.
  - name: Course Digest
    description: Course Digest operations.
  - name: Resources
    description: Resources operations.
  - name: Channels
    description: Channels operations.
  - name: Collaboration Sessions
    description: Collaboration Sessions operations.
  - name: Notifications
    description: Notifications operations.
paths:
  "/courses/{courseId}/files":
    get:
      tags: [Resources]
      summary: List actual course files
      operationId: listCourseFiles
      description: Current members of active or archived courses only. Lists live course_files, latest creation timestamp first with ID descending as tie-breaker, retaining database timestamp precision in opaque course-bound cursors. Not a snapshot across concurrent changes. Deleted and other-course files are excluded. Only cursor and limit query fields are accepted; unknown, repeated or invalid values return invalid_request.
      security:
        - session_cookie: []
      parameters:
        - "$ref": "#/components/parameters/CourseId"
        - "$ref": "#/components/parameters/Cursor"
        - "$ref": "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated live file metadata.
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { "$ref": "#/components/schemas/CourseFile" }
                  page: { "$ref": "#/components/schemas/Page" }
        "400":
          description: Invalid pagination query or cursor (invalid_request).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Invalid read Origin.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Missing, deleting or inaccessible course (not_found).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: File service unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      tags: [Resources]
      summary: Upload an immutable original course file
      operationId: createCourseFile
      description: Existing file upload. Current instructors in active courses only; not TA or student. Exactly one structurally validated file up to 100 MiB; PDF, text, Markdown, PNG, JPEG, WebP, DOCX or PPTX. Safe original filename up to 255 characters. Idempotency binds uploader, course, filename, declared type and SHA-256 for 24 hours; exact retries replay 201 while visible, including after archival. Changed input or deleted-file replay returns 409 idempotency_key_reused. No resource catalog metadata.
      security:
        - session_cookie: []
      parameters:
        - "$ref": "#/components/parameters/CourseId"
        - "$ref": "#/components/parameters/Origin"
        - "$ref": "#/components/parameters/CsrfToken"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Persisted original file, or exact idempotent replay.
          headers:
            Location:
              description: Course-scoped authenticated download path.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { "$ref": "#/components/schemas/CourseFile" }
        "400":
          description: Malformed multipart request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Instructor role, valid Origin or CSRF required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: Course archived or idempotency key reused.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: File exceeds 100 MiB.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "415":
          description: Unsupported multipart media type or invalid file format or structure.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: File parts, name or idempotency key is invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: Storage unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/courses/{courseId}/files/{fileId}/download":
    get:
      tags: [Resources]
      summary: Download original course file bytes
      operationId: downloadCourseFile
      description: Existing authenticated byte stream for current members of the matching active or archived course. No public or presigned URL. Missing, wrong-course, deleted and inaccessible files return not_found.
      security:
        - session_cookie: []
      parameters:
        - "$ref": "#/components/parameters/CourseId"
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Exact original bytes with verified media type and length.
          headers:
            Content-Length:
              schema: { type: integer }
            Content-Disposition:
              description: Attachment with safe filename.
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Invalid read Origin.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: Storage unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/courses/{courseId}/files/{fileId}":
    delete:
      tags: [Resources]
      summary: Logically delete an original course file
      operationId: deleteCourseFile
      description: Existing API-only operation. Original uploader who remains a current instructor in an active course only. Atomically hides the file and queues durable storage cleanup before responding. No Resources deletion UI.
      security:
        - session_cookie: []
      parameters:
        - "$ref": "#/components/parameters/CourseId"
        - name: fileId
          in: path
          required: true
          schema: { type: string }
        - "$ref": "#/components/parameters/Origin"
        - "$ref": "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: File hidden and cleanup durably queued.
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Only original uploader and current instructor, valid Origin and CSRF.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Live file not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: Course archived.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: File service unavailable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/metrics":
    get:
      tags: [Observability]
      summary: Scrape local API and job metrics
      description: Available only when local observability is enabled. Outside the /api/v1 browser API; requests require an operator bearer token. No user session or CORS access.
      operationId: scrapeMetrics
      servers:
        - url: "/"
      security:
        - metrics_bearer: []
      responses:
        "200":
          description: Prometheus text metrics, with fixed-cardinality labels.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Bearer token absent or invalid; no metrics disclosed.
        "404":
          description: Observability disabled.
        "503":
          description: Metric collection failed.
  "/account-verification-requests":
    post:
      tags:
        - Authentication
      summary: Request account email verification
      description:
        Request account email verification before account creation or a same-school
        email change. The server enforces the deployment's allowed school-domain policy
        and returns the same response for every allowed-domain request. If delivery
        is appropriate, it sends a deployment-configured HTTPS link to the web client
        containing a 30-minute, single-use opaque token; clients cannot supply a redirect
        destination. Tokens are stored only as hashes, and the latest request invalidates
        earlier unused tokens for the same normalized email. Rate limits default to
        five requests per normalized email per hour and 100 requests per source IP
        per hour; deployments may configure both limits.
      operationId: createAccountVerificationRequest
      security: []
      responses:
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                origin_not_allowed:
                  summary: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                  value:
                    error:
                      code: origin_not_allowed
                      message: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                      requestId: req_createAccountVerificationRequest
                      details: []
        "202":
          description: The request was accepted. This response does not reveal whether the address is registered or whether mail will be delivered.
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                idempotency_key_reused:
                  summary: The idempotency key was already used with a different request body.
                  value:
                    error:
                      code: idempotency_key_reused
                      message: The idempotency key was already used with a different request body.
                      requestId: req_createAccountVerificationRequest
                      details: []
        "422":
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                email_domain_not_allowed:
                  summary: The normalized email domain is not allowed by this deployment.
                  value:
                    error:
                      code: email_domain_not_allowed
                      message: The normalized email domain is not allowed by this deployment.
                      requestId: req_createAccountVerificationRequest
                      details: []
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              "$ref": "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: The configured per-email or per-source-IP request limit was exceeded.
                  value:
                    error:
                      code: rate_limited
                      message: The configured per-email or per-source-IP request limit was exceeded.
                      requestId: req_createAccountVerificationRequest
                      details: []
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_createAccountVerificationRequest
                      details: []
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_createAccountVerificationRequest
                      details: []
      parameters:
        - "$ref": "#/components/parameters/Origin"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountVerificationRequest"
            example:
              email: ada@example.edu
  "/users":
    post:
      tags:
        - Authentication
      summary: Create account
      description: Create account using a valid pre-account email-verification token. The server derives the verified email from the token and atomically creates the account, finds or creates the school-domain organization, assigns it directly through users.organization_id, and consumes the proof. ChalkTalk has no organization-membership table. The password is accepted only at this boundary and is never returned.
      operationId: createAccount
      security: []
      responses:
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                origin_not_allowed:
                  summary: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                  value:
                    error:
                      code: origin_not_allowed
                      message: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                      requestId: req_createAccount
                      details: []
        "201":
          description: The account and its direct organization association were created and the verification proof was consumed atomically.
          headers:
            Location:
              "$ref": "#/components/headers/Location"
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
              example:
                {
                  "data":
                    {
                      "id": "user_123",
                      "email": "ada@example.edu",
                      "displayName": "Ada Lovelace",
                      "createdAt": "2026-09-20T14:30:00Z",
                      "updatedAt": "2026-09-20T14:30:00Z",
                      "version": 1,
                    },
                }
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                email_in_use:
                  summary: The email already belongs to an account.
                  value:
                    error:
                      code: email_in_use
                      message: The email already belongs to an account.
                      requestId: req_createAccount
                      details: []
                verification_token_used:
                  summary: The verification token has already been consumed.
                  value:
                    error:
                      code: verification_token_used
                      message: The verification token has already been consumed.
                      requestId: req_createAccount
                      details: []
                idempotency_key_reused:
                  summary: The idempotency key was already used with a different request body.
                  value:
                    error:
                      code: idempotency_key_reused
                      message: The idempotency key was already used with a different request body.
                      requestId: req_createAccount
                      details: []
        "422":
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                verification_token_invalid:
                  summary: The verification token is invalid, expired, or superseded by a later request.
                  value:
                    error:
                      code: verification_token_invalid
                      message: The verification token is invalid, expired, or superseded by a later request.
                      requestId: req_createAccount
                      details: []
                weak_password:
                  summary: The password or another field fails validation.
                  value:
                    error:
                      code: weak_password
                      message: The password or another field fails validation.
                      requestId: req_createAccount
                      details: []
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many account-creation attempts.
                  value:
                    error:
                      code: rate_limited
                      message: Too many account-creation attempts.
                      requestId: req_createAccount
                      details: []
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_createAccount
                      details: []
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_createAccount
                      details: []
      parameters:
        - "$ref": "#/components/parameters/Origin"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateAccountRequest"
            example:
              verificationToken: opaque_email_verification_token
              password: correct horse battery staple
              displayName: Ada Lovelace
  "/sessions":
    post:
      tags:
        - Authentication
      summary: Sign in
      description: Sign in and create a 30-day browser session. Success always sets `__Host-chalktalk_session` with Path=/, Max-Age=2592000, Secure, HttpOnly, and SameSite=Lax, without a Domain attribute. It returns a non-null opaque CSRF token that remains stable for the session lifetime. The response is not stored.
      operationId: createSession
      security: []
      responses:
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                origin_not_allowed:
                  summary: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                  value:
                    error:
                      code: origin_not_allowed
                      message: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                      requestId: req_createSession
                      details: []
        "201":
          description: Creates a cookie-authenticated browser session and returns its stable CSRF token.
          headers:
            Set-Cookie:
              "$ref": "#/components/headers/SetSessionCookie"
            Cache-Control:
              "$ref": "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionResponse"
              example:
                data:
                  id: session_123
                  user:
                    id: user_123
                    email: ada@example.edu
                    displayName: Ada Lovelace
                    createdAt: "2026-09-20T14:30:00Z"
                    updatedAt: "2026-09-20T14:30:00Z"
                    version: 3
                  expiresAt: "2026-10-20T14:30:00Z"
                  csrfToken: opaque_csrf_token
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                invalid_credentials:
                  summary: The email or password is invalid.
                  value:
                    error:
                      code: invalid_credentials
                      message: The email or password is invalid.
                      requestId: req_createSession
                      details: []
        "422":
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                validation_failed:
                  summary: The email or password field is malformed.
                  value:
                    error:
                      code: validation_failed
                      message: The email or password field is malformed.
                      requestId: req_createSession
                      details: []
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many sign-in attempts.
                  value:
                    error:
                      code: rate_limited
                      message: Too many sign-in attempts.
                      requestId: req_createSession
                      details: []
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_createSession
                      details: []
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_createSession
                      details: []
      parameters:
        - "$ref": "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSessionRequest"
            example:
              email: ada@example.edu
              password: correct horse battery staple
  "/sessions/current":
    get:
      tags:
        - Authentication
      summary: Retrieve current session
      description: Retrieve the current browser session after a page load or reload. Returns the same stable CSRF token issued at sign-in without rotating it or extending the session expiry. The response is not stored.
      operationId: getCurrentSession
      security:
        - session_cookie: []
      responses:
        "200":
          description: The current authenticated session and its stable CSRF token.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionResponse"
              example:
                data:
                  id: session_123
                  user:
                    id: user_123
                    email: ada@example.edu
                    displayName: Ada Lovelace
                    createdAt: "2026-09-20T14:30:00Z"
                    updatedAt: "2026-09-20T14:30:00Z"
                    version: 3
                  expiresAt: "2026-10-20T14:30:00Z"
                  csrfToken: opaque_csrf_token
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                authentication_required:
                  summary: The session is missing, expired, or invalid.
                  value:
                    error:
                      code: authentication_required
                      message: The session is missing, expired, or invalid.
                      requestId: req_getCurrentSession
                      details: []
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_getCurrentSession
                      details: []
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_getCurrentSession
                      details: []
    delete:
      tags:
        - Authentication
      summary: Sign out
      description: Sign out. Revokes the current session and its CSRF token, then expires the browser cookie.
      operationId: deleteCurrentSession
      security:
        - session_cookie: []
      responses:
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                csrf_validation_failed:
                  summary: The request origin or CSRF token is missing, invalid, or does not match the session.
                  value:
                    error:
                      code: csrf_validation_failed
                      message: The request origin or CSRF token is missing, invalid, or does not match the session.
                      requestId: req_deleteCurrentSession
                      details: []
        "204":
          description: The session was revoked and the browser cookie was expired.
          headers:
            Set-Cookie:
              "$ref": "#/components/headers/ClearSessionCookie"
        "401":
          description: Unauthorized
          content:
            application/json:
