  /attachments/{attachmentId}/download:
    get:
      tags: [Posts]
      summary: Stream an attached file
      description: Requires current course membership and a visible, live parent. Archived courses remain download-only. Confirmed duplicate sources and deleted parents hide their files without moving bytes.
      security: [{ session_cookie: [] }]
      parameters:
        [
          {
            name: attachmentId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
