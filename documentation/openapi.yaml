          },
          {
            name: left,
            in: query,
            required: true,
            schema: { type: string, format: uuid },
          },
          {
            name: right,
            in: query,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        "200":
          description: Two full text states for comparison.
          headers:
            Cache-Control:
              { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/TextRevisionCompareResponse" }
        "404":
          description: Resource hidden or either revision does not belong to it.
  "/followups/{followupId}/revisions/{revisionId}":
    get:
      tags: [Answers]
      summary: Read one followup text revision
      operationId: getFollowupTextRevision
