      parameters:
        [
          {
            name: answerId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
          {
            name: revisionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        "200":
          description: Authorized text snapshot.
          headers:
            Cache-Control:
              { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextRevisionResponse" }
        "404":
          description: Resource hidden or revision foreign or missing.
  "/answers/{answerId}/revisions/{revisionId}/restore":
    post:
      tags: [Answers]
      summary: Restore answer text without changing nontext state
      operationId: restoreAnswerTextRevision
      security: [{ session_cookie: [] }]
      parameters:
        [
          {
            name: answerId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
          {
            name: revisionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
          { $ref: "#/components/parameters/IfMatch" },
