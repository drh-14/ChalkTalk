    delete:
      tags: [Posts]
      summary: Remove a file from its parent
      description: Requires current parent edit permission and an active course. Immediately hides the file, increments the parent version, and queues durable physical deletion for the separate worker. Answer removals also update contributor history and clear current endorsement while preserving Markdown and historical events.
