        times for a course. Daily activity is grouped by UTC calendar date. Average
        response time includes questions that first received an endorsed answer during
        the selected period and measures the elapsed time from question creation to
        creation of that first-endorsed answer. Recorded views are deduplicated by
        member, post, and UTC date; view history begins at deployment.
