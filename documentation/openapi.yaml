            - followup_created
            - reply_created
            - announcement
            - post_published
            - mentioned
          description: What happened on the post.
        courseId:
          type: string
          description: Course of the post.
        courseName:
          type: string
          description: Current course name.
        postId:
          type: string
          description: Post the activity happened on.
        postTitle:
          type: string
          description: Current post title.
        actor:
          description: Who acted. Students see Anonymous for an anonymous actor; null for a deleted account.
          oneOf:
            - type: object
              properties:
                displayName:
                  type: string
              additionalProperties: false
              required:
                - displayName
            - type: "null"
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp in ISO 8601 date-time format.
        readAt:
          type:
            - string
            - "null"
          format: date-time
          description: When the caller read it, or null while unread.
      additionalProperties: false
      required:
        - id
        - kind
        - courseId
        - courseName
        - postId
        - postTitle
        - actor
        - createdAt
        - readAt
