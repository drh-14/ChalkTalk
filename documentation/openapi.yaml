---
openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ChalkTalk API
  version: 1.0.0
  summary: HTTP contract for ChalkTalk clients.
  description: >-
    ChalkTalk course discussion, content, collaboration, and administration API.
    Browser requests use the `__Host-chalktalk_session` cookie. Credentialed CORS
    responses echo only an exact deployment-configured HTTPS frontend origin,
    include `Vary: Origin` and `Access-Control-Allow-Credentials: true`, and never
    use a wildcard origin. Every unsafe request validates `Origin`; authenticated
    unsafe requests also validate the session-bound `X-CSRF-Token`. Expiring or
    revoking a session invalidates its CSRF token and unused WebSocket tickets.
  license:
    name: MIT
    identifier: MIT
servers:
- url: "/api/v1"
tags:
- name: Authentication
  description: Authentication operations.
- name: Organizations
  description: Organizations operations.
- name: Courses
  description: Courses operations.
- name: Course Memberships
  description: Course Memberships operations.
- name: Posts
  description: Posts operations.
- name: Answers
  description: Answers operations.
- name: Statistics
  description: Statistics operations.
- name: Course Digest
  description: Course Digest operations.
- name: Resources
  description: Resources operations.
- name: Channels
  description: Channels operations.
- name: Collaboration Sessions
  description: Collaboration Sessions operations.
paths:
  "/account-verification-requests":
    post:
      tags:
      - Authentication
      summary: Request account email verification
      description: Request account email verification before account creation or a same-school
        email change. The server enforces the deployment's allowed school-domain policy
        and returns the same response for every allowed-domain request. If delivery
        is appropriate, it sends a deployment-configured HTTPS link to the web client
        containing a 30-minute, single-use opaque token; clients cannot supply a redirect
        destination. Tokens are stored only as hashes, and the latest request invalidates
        earlier unused tokens for the same normalized email. Rate limits default to
        five requests per normalized email per hour and 100 requests per source IP
        per hour; deployments may configure both limits.
      operationId: createAccountVerificationRequest
      security: []
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                origin_not_allowed:
                  summary: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                  value:
                    error:
                      code: origin_not_allowed
                      message: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                      requestId: req_createAccountVerificationRequest
                      details: []
        '202':
          description: The request was accepted. This response does not reveal whether the address is registered or whether mail will be delivered.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                idempotency_key_reused:
                  summary: The idempotency key was already used with a different request body.
                  value:
                    error:
                      code: idempotency_key_reused
                      message: The idempotency key was already used with a different request body.
                      requestId: req_createAccountVerificationRequest
                      details: []
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                email_domain_not_allowed:
                  summary: The normalized email domain is not allowed by this deployment.
                  value:
                    error:
                      code: email_domain_not_allowed
                      message: The normalized email domain is not allowed by this deployment.
                      requestId: req_createAccountVerificationRequest
                      details: []
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              "$ref": "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: The configured per-email or per-source-IP request limit was exceeded.
                  value:
                    error:
                      code: rate_limited
                      message: The configured per-email or per-source-IP request limit was exceeded.
                      requestId: req_createAccountVerificationRequest
                      details: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_createAccountVerificationRequest
                      details: []
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_createAccountVerificationRequest
                      details: []
      parameters:
      - "$ref": "#/components/parameters/Origin"
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountVerificationRequest"
            example:
              email: ada@example.edu
  "/users":
    post:
      tags:
      - Authentication
      summary: Create account
      description: Create account using a valid pre-account email-verification token. The server derives the verified email from the token and atomically creates the account, finds or creates the school-domain organization, creates its membership, and consumes the proof. The password is accepted only at this boundary and is never returned.
      operationId: createAccount
      security: []
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                origin_not_allowed:
                  summary: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                  value:
                    error:
                      code: origin_not_allowed
                      message: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                      requestId: req_createAccount
                      details: []
        '201':
          description: The account, organization association, and membership were created and the verification proof was consumed atomically.
          headers:
            Location:
              "$ref": "#/components/headers/Location"
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
              example: {"data":{"id":"user_123","email":"ada@example.edu","displayName":"Ada Lovelace","createdAt":"2026-09-20T14:30:00Z","updatedAt":"2026-09-20T14:30:00Z","version":1}}
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                email_in_use:
                  summary: The email already belongs to an account.
                  value:
                    error:
                      code: email_in_use
                      message: The email already belongs to an account.
                      requestId: req_createAccount
                      details: []
                verification_token_used:
                  summary: The verification token has already been consumed.
                  value:
                    error:
                      code: verification_token_used
                      message: The verification token has already been consumed.
                      requestId: req_createAccount
                      details: []
                idempotency_key_reused:
                  summary: The idempotency key was already used with a different request body.
                  value:
                    error:
                      code: idempotency_key_reused
                      message: The idempotency key was already used with a different request body.
                      requestId: req_createAccount
                      details: []
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                verification_token_invalid:
                  summary: The verification token is invalid, expired, or superseded by a later request.
                  value:
                    error:
                      code: verification_token_invalid
                      message: The verification token is invalid, expired, or superseded by a later request.
                      requestId: req_createAccount
                      details: []
                weak_password:
                  summary: The password or another field fails validation.
                  value:
                    error:
                      code: weak_password
                      message: The password or another field fails validation.
                      requestId: req_createAccount
                      details: []
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many account-creation attempts.
                  value:
                    error:
                      code: rate_limited
                      message: Too many account-creation attempts.
                      requestId: req_createAccount
                      details: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_createAccount
                      details: []
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_createAccount
                      details: []
      parameters:
      - "$ref": "#/components/parameters/Origin"
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateAccountRequest"
            example:
              verificationToken: opaque_email_verification_token
              password: correct horse battery staple
              displayName: Ada Lovelace
  "/sessions":
    post:
      tags:
      - Authentication
      summary: Sign in
      description: Sign in and create a 30-day browser session. Success always sets `__Host-chalktalk_session` with Path=/, Max-Age=2592000, Secure, HttpOnly, and SameSite=Lax, without a Domain attribute. It returns a non-null opaque CSRF token that remains stable for the session lifetime. The response is not stored.
      operationId: createSession
      security: []
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                origin_not_allowed:
                  summary: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                  value:
                    error:
                      code: origin_not_allowed
                      message: The Origin header is missing, null, or not an allowed HTTPS frontend origin.
                      requestId: req_createSession
                      details: []
        '201':
          description: Creates a cookie-authenticated browser session and returns its stable CSRF token.
          headers:
            Set-Cookie:
              "$ref": "#/components/headers/SetSessionCookie"
            Cache-Control:
              "$ref": "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionResponse"
              example:
                data:
                  id: session_123
                  user:
                    id: user_123
                    email: ada@example.edu
                    displayName: Ada Lovelace
                    createdAt: '2026-09-20T14:30:00Z'
                    updatedAt: '2026-09-20T14:30:00Z'
                    version: 3
                  expiresAt: '2026-10-20T14:30:00Z'
                  csrfToken: opaque_csrf_token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                invalid_credentials:
                  summary: The email or password is invalid.
                  value:
                    error:
                      code: invalid_credentials
                      message: The email or password is invalid.
                      requestId: req_createSession
                      details: []
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                validation_failed:
                  summary: The email or password field is malformed.
                  value:
                    error:
                      code: validation_failed
                      message: The email or password field is malformed.
                      requestId: req_createSession
                      details: []
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many sign-in attempts.
                  value:
                    error:
                      code: rate_limited
                      message: Too many sign-in attempts.
                      requestId: req_createSession
                      details: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_createSession
                      details: []
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_createSession
                      details: []
      parameters:
      - "$ref": "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSessionRequest"
            example:
              email: ada@example.edu
              password: correct horse battery staple
  "/sessions/current":
    get:
      tags:
      - Authentication
      summary: Retrieve current session
      description: Retrieve the current browser session after a page load or reload. Returns the same stable CSRF token issued at sign-in without rotating it or extending the session expiry. The response is not stored.
      operationId: getCurrentSession
      security:
      - session_cookie: []
      responses:
        '200':
          description: The current authenticated session and its stable CSRF token.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionResponse"
              example:
                data:
                  id: session_123
                  user:
                    id: user_123
                    email: ada@example.edu
                    displayName: Ada Lovelace
                    createdAt: '2026-09-20T14:30:00Z'
                    updatedAt: '2026-09-20T14:30:00Z'
                    version: 3
                  expiresAt: '2026-10-20T14:30:00Z'
                  csrfToken: opaque_csrf_token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                authentication_required:
                  summary: The session is missing, expired, or invalid.
                  value:
                    error:
                      code: authentication_required
                      message: The session is missing, expired, or invalid.
                      requestId: req_getCurrentSession
                      details: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_getCurrentSession
                      details: []
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_getCurrentSession
                      details: []
    delete:
      tags:
      - Authentication
      summary: Sign out
      description: Sign out. Revokes the current session, its CSRF token, and its unused WebSocket connection tickets, then expires the browser cookie.
      operationId: deleteCurrentSession
      security:
      - session_cookie: []
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                csrf_validation_failed:
                  summary: The request origin or CSRF token is missing, invalid, or does not match the session.
                  value:
                    error:
                      code: csrf_validation_failed
                      message: The request origin or CSRF token is missing, invalid, or does not match the session.
                      requestId: req_deleteCurrentSession
                      details: []
        '204':
          description: The session was revoked and the browser cookie was expired.
          headers:
            Set-Cookie:
              "$ref": "#/components/headers/ClearSessionCookie"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                authentication_required:
                  summary: The session is missing or invalid.
                  value:
                    error:
                      code: authentication_required
                      message: The session is missing or invalid.
                      requestId: req_deleteCurrentSession
                      details: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_deleteCurrentSession
                      details: []
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_deleteCurrentSession
                      details: []
      parameters:
      - "$ref": "#/components/parameters/Origin"
      - "$ref": "#/components/parameters/CsrfToken"
  "/users/me":
    get:
      tags:
      - Authentication
      summary: Retrieve account profile
      description: Retrieve account profile.
      operationId: getCurrentUser
      security:
      - session_cookie: []
      responses:
        '200':
          description: Retrieve account profile completed successfully.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
              example:
                data:
                  id: user_123
                  email: ada@example.edu
                  displayName: Ada Lovelace
                  createdAt: '2026-09-20T14:30:00Z'
                  updatedAt: '2026-09-20T14:30:00Z'
                  version: 3
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                authentication_required:
                  summary: Authentication is required.
                  value:
                    error:
                      code: authentication_required
                      message: Authentication is required.
                      requestId: req_getCurrentUser
                      details: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_getCurrentUser
                      details: []
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_getCurrentUser
                      details: []
    patch:
      tags:
      - Authentication
      summary: Update account profile
      description: Update account profile. A replacement email requires a valid email-verification
        token and must have the same canonical school domain as the account's current
        email. Organization and course memberships do not change. At least one field
        is required.
      operationId: updateCurrentUser
      security:
      - session_cookie: []
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                csrf_validation_failed:
                  summary: The request origin or CSRF token is missing, invalid, or does not match the session.
                  value:
                    error:
                      code: csrf_validation_failed
                      message: The request origin or CSRF token is missing, invalid, or does not match the session.
                      requestId: req_updateCurrentUser
                      details: []
        '200':
          description: The profile was updated. When an email-verification token is supplied,
            the account and verification proof are updated atomically.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
              example:
                data:
                  id: user_123
                  email: ada.byron@example.edu
                  displayName: Ada Byron
                  createdAt: '2026-09-20T14:30:00Z'
                  updatedAt: '2026-09-20T14:40:00Z'
                  version: 4
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                authentication_required:
                  summary: Authentication is required.
                  value:
                    error:
                      code: authentication_required
                      message: Authentication is required.
                      requestId: req_updateCurrentUser
                      details: []
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                email_in_use:
                  summary: The replacement email is already used.
                  value:
                    error:
                      code: email_in_use
                      message: The replacement email is already used.
                      requestId: req_updateCurrentUser
                      details: []
                verification_token_used:
                  summary: The email verification token has already been consumed.
                  value:
                    error:
                      code: verification_token_used
                      message: The email verification token has already been consumed.
                      requestId: req_updateCurrentUser
                      details: []
        '412':
          description: Precondition Failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                version_conflict:
                  summary: The supplied ETag is stale.
                  value:
                    error:
                      code: version_conflict
                      message: The supplied ETag is stale.
                      requestId: req_updateCurrentUser
                      details: []
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                email_domain_not_allowed:
                  summary: The replacement email does not use the account's current canonical school domain.
                  value:
                    error:
                      code: email_domain_not_allowed
                      message: The replacement email does not use the account's current canonical school domain.
                      requestId: req_updateCurrentUser
                      details: []
                validation_failed:
                  summary: No valid editable field was supplied.
                  value:
                    error:
                      code: validation_failed
                      message: No valid editable field was supplied.
                      requestId: req_updateCurrentUser
                      details: []
                verification_token_invalid:
                  summary: The email verification token is invalid, expired, or superseded by a later request.
                  value:
                    error:
                      code: verification_token_invalid
                      message: The email verification token is invalid, expired, or superseded by a later request.
                      requestId: req_updateCurrentUser
                      details: []
        '428':
          description: Precondition Required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                precondition_required:
                  summary: If-Match is required.
                  value:
                    error:
                      code: precondition_required
                      message: If-Match is required.
                      requestId: req_updateCurrentUser
                      details: []
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                internal_error:
                  summary: The server could not complete the request.
                  value:
                    error:
                      code: internal_error
                      message: The server could not complete the request.
                      requestId: req_updateCurrentUser
                      details: []
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                service_unavailable:
                  summary: A required service is temporarily unavailable.
                  value:
                    error:
                      code: service_unavailable
                      message: A required service is temporarily unavailable.
                      requestId: req_updateCurrentUser
                      details: []
      parameters:
      - "$ref": "#/components/parameters/Origin"
      - "$ref": "#/components/parameters/IfMatch"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateUserRequest"
            example:
              displayName: Ada Byron
              emailVerificationToken: opaque_email_verification_token
    delete:
      tags:
      - Authentication
      summary: Delete account
      description: Delete account. Retained contributions are pseudonymized, and all sessions, their CSRF tokens, and their unused WebSocket connection tickets are revoked. The reauthenticationProof field is conditional on deployment policy.
      operationId: deleteCurrentUser
      security:
      - session_cookie: []
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                csrf_validation_failed:
                  summary: The request origin or CSRF token is missing, invalid, or does not match the session.
                  value:
                    error:
                      code: csrf_validation_failed
                      message: The request origin or CSRF token is missing, invalid, or does not match the session.
                      requestId: req_deleteCurrentUser
                      details: []
        '204':
          description: Retained contributions are pseudonymized, and all sessions, their CSRF tokens, and their unused WebSocket connection tickets are revoked. The reauthenticationProof field is conditional on deployment policy.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
