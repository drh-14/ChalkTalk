          description: Opaque stable identifier.
          minLength: 1
          maxLength: 255
        courseId:
          type: string
          description: Opaque stable identifier.
          minLength: 1
          maxLength: 255
        status:
          type: string
          description: Session lifecycle state.
          enum:
            - active
            - ended
        anchor:
          "$ref": "#/components/schemas/CollaborationAnchor"
        title:
          type: string
          description: Session title, trimmed, 1 to 120 characters.
          minLength: 1
          maxLength: 120
        language:
          "$ref": "#/components/schemas/CollaborationLanguage"
        createdBy:
          type: string
          description: Opaque stable identifier.
          minLength: 1
          maxLength: 255
        participants:
          type: array
          description: The creator and invited participants.
          items:
            "$ref": "#/components/schemas/CollaborationParticipant"
        endedAt:
          type:
            - string
            - "null"
          description: End time; null while active.
          format: date-time
        createdAt:
          type: string
          description: UTC timestamp in ISO 8601 date-time format.
          format: date-time
        updatedAt:
          type: string
          description: UTC timestamp in ISO 8601 date-time format.
          format: date-time
        version:
          type: integer
          description: Revision number used to construct the resource ETag.
          minimum: 1
      additionalProperties: false
      required:
        - id
        - courseId
        - status
        - anchor
        - title
        - language
        - createdBy
        - participants
        - endedAt
        - createdAt
        - updatedAt
        - version
    CollaborationConnectionTicket:
      type: object
      properties:
        ticket:
          type: string
          description: Opaque one-use secret, sent as the Hocuspocus token when opening the WebSocket.
          minLength: 1
        webSocketUrl:
          type: string
          description: Credential-free WebSocket URL.
          format: uri
        documentId:
          type: string
          description: Document name to open, derived by the server as collaboration-session:{id}.
          minLength: 1
          maxLength: 255
        expiresAt:
          type: string
          description: UTC expiry timestamp, five minutes after ticket issuance.
          format: date-time
        permission:
          type: string
          description: read for a viewer, whose connection is read-only; write otherwise.
          enum:
            - read
            - write
      additionalProperties: false
      required:
        - ticket
        - webSocketUrl
        - documentId
        - expiresAt
        - permission
    CollaborationSnapshot:
      type: object
      properties:
        collaborationSessionId:
          type: string
          description: Opaque stable collaboration-session identifier.
          minLength: 1
          maxLength: 255
        documentId:
          type: string
          description: Document name derived from the collaboration session.
          minLength: 1
          maxLength: 255
        sessionStatus:
          type: string
          description: Collaboration-session state when the snapshot was captured.
          enum:
            - active
            - ended
        content:
          type: string
          description: Plain-text projection of Y.Text('content'), at most 200,000 characters.
          maxLength: 200000
        whiteboard:
          type: array
          description: Non-deleted whiteboard elements as last persisted, in drawing order (fractional index, then id).
          maxItems: 5000
          items:
            "$ref": "#/components/schemas/WhiteboardElement"
        persistedAt:
          type: string
          description: UTC timestamp of the returned snapshot.
          format: date-time
        capturedAt:
          type: string
          description: UTC timestamp when the response projection was captured.
          format: date-time
      additionalProperties: false
      required:
        - collaborationSessionId
        - documentId
        - sessionStatus
        - content
        - whiteboard
        - persistedAt
        - capturedAt
    WhiteboardElement:
      type: object
      description: An Excalidraw 0.18 element. Fields beyond those listed are kept as drawn; the collaboration server enforces the rules in the collaboration WebSocket protocol.
      properties:
        id:
          type: string
          description: Element identifier; also its key in Y.Map('whiteboard').
          minLength: 1
        type:
          type: string
          description: Element kind.
          enum:
            - rectangle
            - ellipse
            - diamond
            - line
            - arrow
            - freedraw
            - text
        version:
          type: integer
          description: Excalidraw element version; the higher version wins a concurrent edit.
          minimum: 1
        versionNonce:
          type: integer
          description: Tie-breaker between equal versions.
        index:
          type:
            - string
            - "null"
          description: Fractional index that orders elements for drawing.
        link:
          type:
            - string
            - "null"
          description: Absolute http or https URL.
          maxLength: 2048
        points:
          type: array
          description: Point list of a line, arrow, or freedraw element; at most 10,000 for freedraw.
          items:
            type: array
            items:
              type: number
        text:
          type: string
          description: Text of a text element.
          maxLength: 10000
      additionalProperties: true
      required:
        - id
        - type
