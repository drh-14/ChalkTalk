    post:
      tags: [Resources]
      operationId: createResource
      summary: Create a named external link
      description: Current instructors in active courses only. JSON link creation, never a file upload or catalog wrapper. Title is trimmed and nonblank up to 200 Unicode code points; URL must be absolute HTTP(S) with hostname up to 2048 Unicode code points, without credentials, raw Unicode whitespace (including surrounding whitespace), C0/C1 controls or backslashes before parsing. Percent-encoded bytes and ordinary non-ASCII path characters are allowed. No target fetch. Optional Idempotency-Key binds creator/course/trimmed title and accepted URL for 24 hours transactionally; exact current-instructor retries replay 201 while visible including after archive, changed input returns idempotency_key_reused. No new archived or deleting writes.
      security:
        - session_cookie: []
      parameters:
        - "$ref": "#/components/parameters/CourseId"
        - "$ref": "#/components/parameters/Origin"
        - "$ref": "#/components/parameters/CsrfToken"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, title, url]
              properties:
                kind: { type: string, const: link }
                title: { type: string, minLength: 1, maxLength: 200 }
                url:
                  {
                    type: string,
                    format: uri,
                    maxLength: 2048,
                    pattern: "^[Hh][Tt][Tt][Pp][Ss]?://",
                  }
      responses:
        "201":
          description: Persisted named link or exact authorized replay.
          headers:
            Location:
              description: Unified collection path.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { "$ref": "#/components/schemas/CourseResourceLink" }
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/Error" }
        "403":
          description: Instructor role, Origin or CSRF required.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/Error" }
        "409":
          description: Course archived/deleting or idempotency key reused.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/Error" }
        "422":
          description: JSON required, invalid link body or idempotency key.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/Error" }
        "503":
          description: Resource service unavailable.
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/Error" }
