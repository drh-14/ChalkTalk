          },
          { name: cursor, in: query, schema: { type: integer, minimum: 1 } },
        ]
      responses:
        "200":
          description: Up to 50 oldest-to-newest revision metadata records for a current reader.
          headers:
            Cache-Control:
              { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TextRevisionListResponse" }
        "400": { description: Invalid cursor or query parameter. }
        "404":
          description: Resource is absent or not currently readable.
  "/followups/{followupId}/revisions/compare":
    get:
      tags: [Answers]
