        "404":
          description: Resource hidden or revision foreign or missing.
  "/followups/{followupId}/revisions/{revisionId}/restore":
    post:
      tags: [Answers]
      summary: Restore followup text without changing nontext state
      operationId: restoreFollowupTextRevision
      security: [{ session_cookie: [] }]
      parameters:
        [
          {
            name: followupId,
