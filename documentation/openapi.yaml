      tags: [Resources]
      operationId: listCourseResources
      summary: List flat original files and named external links
      description: Current members of active or archived courses only. UNION ALL of actual live course_files and course_resource_links, ordered by exact creation timestamp DESC, ID DESC and kind DESC (upload before link on equal timestamp and ID). No wrapper rows or hidden creator metadata. Strict single limit/cursor fields only; cursors preserve PostgreSQL microseconds and bind endpoint and course. Pagination is not a snapshot across concurrent changes. Missing, deleting and inaccessible courses are hidden.
      security:
        - session_cookie: []
      parameters:
        - "$ref": "#/components/parameters/CourseId"
        - "$ref": "#/components/parameters/Cursor"
        - "$ref": "#/components/parameters/Limit"
      responses:
        "200":
          description: Flat mixed resource page.
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
