          schema:
            type: boolean
        - name: announcement
          in: query
          required: false
          description: Only true is accepted; lists announcements only.
          schema:
            type: boolean
            enum:
              - true
        - name: private
          in: query
          required: false
          description: Only true is accepted; lists the private posts the caller can read.
          schema:
            type: boolean
            enum:
              - true
        - name: authorRole
          in: query
          required: false
