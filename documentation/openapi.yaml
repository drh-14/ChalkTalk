      responses:
        "200":
          description: Restored content with a new ETag and audit revision.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control:
              { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Followup" }
        "403": { description: Staff role required. }
        "404": { description: Resource hidden or revision foreign or missing. }
        "409": { description: Course archived. }
        "412": { description: Stale If-Match. }
        "428": { description: If-Match required. }
components:
  securitySchemes:
    metrics_bearer:
      type: http
      scheme: bearer
      description: Local operator-only METRICS_TOKEN, distinct from browser sessions.
    session_cookie:
      type: apiKey
      in: cookie
      name: __Host-chalktalk_session
      description: Opaque 30-day browser session stored with Path=/, Secure, HttpOnly, and SameSite=Lax and without a Domain attribute.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      description: Page size; defaults to 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    FollowupLimit:
      name: limit
      in: query
      required: false
      description: Page size; defaults to 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest retrieval; stale values return version_conflict.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique retry key, up to 255 characters, retained for 24 hours. A matching retry returns the original result; reuse with a different request body returns idempotency_key_reused.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Origin:
      name: Origin
      in: header
      required: true
      description: Browser origin. It must exactly match a deployment-configured HTTPS frontend origin.
      schema:
        type: string
        format: uri
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Stable opaque token bound to the authenticated session. Required with every authenticated POST, PUT, PATCH, and DELETE request.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: Identifies the organization resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    CourseId:
      name: courseId
      in: path
      required: true
      description: Identifies the course resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    UserId:
      name: userId
      in: path
      required: true
      description: Identifies the user resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    PostId:
      name: postId
      in: path
      required: true
      description: Identifies the post resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    AnswerId:
      name: answerId
      in: path
      required: true
      description: Identifies the answer resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    FollowupId:
      name: followupId
      in: path
      required: true
      description: Identifies the followup resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: Identifies the resource resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ResourceRegionId:
      name: resourceRegionId
      in: path
      required: true
      description: Identifies the resourceRegion resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ChannelId:
      name: channelId
      in: path
      required: true
      description: Identifies the channel resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    SubchannelId:
      name: subchannelId
      in: path
      required: true
      description: Identifies the subchannel resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    MessageId:
      name: messageId
      in: path
      required: true
      description: Identifies the message resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    CollaborationSessionId:
      name: collaborationSessionId
      in: path
      required: true
      description: Identifies the collaborationSession resource.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    ETag:
      description: Opaque revision token representing the returned resource state. Clients must return it unchanged in a later If-Match request.
      schema:
        type: string
      example: '"opaque-revision-token"'
    CacheControlNoStore:
      description: Prevents clients and intermediaries from storing the sensitive response.
      schema:
        type: string
        const: no-store
      example: no-store
    Location:
      description: Relative URL of the created resource or deletion status resource.
      schema:
        type: string
      example: "/api/v1/courses/course_123"
    SetSessionCookie:
      description: Secure HTTP-only host-prefixed 30-day browser session cookie. It never includes a Domain attribute.
      schema:
        type: string
        example: __Host-chalktalk_session=opaque; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax
    ClearSessionCookie:
      description: Expires the secure HTTP-only browser session cookie. It never includes a Domain attribute.
      schema:
        type: string
        example: __Host-chalktalk_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax
    RetryAfter:
      description: Time the client must wait before retrying, expressed as seconds or an HTTP date.
      schema:
        type: string
        minLength: 1
      example: "3600"
  schemas:
    TextRevision:
      type: object
      additionalProperties: false
      required:
        [
          id,
          ordinal,
          resourceVersion,
          createdAt,
          title,
          bodyMarkdown,
          baseline,
          restoredFromRevisionId,
          editor,
        ]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        resourceVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        title:
          {
            type: [string, "null"],
            description: "Null for answers and followups.",
          }
        bodyMarkdown: { type: string }
        baseline:
          {
            type: boolean,
            description: "Current text captured as a baseline without an inferred editor.",
          }
        restoredFromRevisionId: { type: [string, "null"], format: uuid }
        editor:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, displayName]
              properties:
                {
                  id: { type: string, format: uuid },
                  displayName: { type: string },
                }
          description: Null for unknown/deleted editors and for revisions captured while anonymous when read by students, regardless of current anonymity.
    TextRevisionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { $ref: "#/components/schemas/TextRevision" } }
    TextRevisionMetadata:
      type: object
      additionalProperties: false
      required: [id, ordinal, resourceVersion, createdAt, baseline, restoredFromRevisionId, editor]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        resourceVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        baseline: { type: boolean }
        restoredFromRevisionId: { type: [string, "null"], format: uuid }
        editor:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, displayName]
              properties:
                { id: { type: string, format: uuid }, displayName: { type: string } }
    TextRevisionListResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          { type: array, maxItems: 50, items: { $ref: "#/components/schemas/TextRevisionMetadata" } }
        page:
          type: object
          additionalProperties: false
          required: [nextCursor]
          properties:
            nextCursor: { type: [string, "null"] }
    TextRevisionCompareResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [left, right]
          properties:
            {
              left: { $ref: "#/components/schemas/TextRevision" },
              right: { $ref: "#/components/schemas/TextRevision" },
            }
    CourseResourceLink:
      type: object
      additionalProperties: false
      required: [kind, id, courseId, title, url, createdAt]
      properties:
        kind: { type: string, const: link }
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri, maxLength: 2048 }
        createdAt: { type: string, format: date-time }
    CourseResource:
      oneOf:
        - "$ref": "#/components/schemas/CourseResourceLink"
        - type: object
          additionalProperties: false
          required:
            [kind, id, courseId, fileName, mediaType, sizeBytes, createdAt]
          properties:
            kind: { type: string, const: upload }
            id: { type: string, format: uuid }
            courseId: { type: string, format: uuid }
            fileName: { type: string }
            mediaType: { type: string }
            sizeBytes: { type: integer, minimum: 1, maximum: 104857600 }
            createdAt: { type: string, format: date-time }
    CourseFile:
      type: object
      additionalProperties: false
      required: [id, courseId, fileName, mediaType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mediaType:
          type: string
          enum:
            [
              application/pdf,
              text/plain,
              text/markdown,
              image/png,
              image/jpeg,
              image/webp,
              application/vnd.openxmlformats-officedocument.wordprocessingml.document,
              application/vnd.openxmlformats-officedocument.presentationml.presentation,
            ]
        sizeBytes: { type: integer, minimum: 1, maximum: 104857600 }
        createdAt: { type: string, format: date-time }
    ErrorDetail:
      type: object
      properties:
        location:
          type: string
          description: Request area containing the problem.
          enum:
            - path
            - query
            - header
            - body
        path:
          type: string
          description: Dot-separated path to the invalid value.
          minLength: 1
        code:
          type: string
          description: Stable machine-readable field error code.
          minLength: 1
        message:
          type: string
          description: Human-readable explanation of the field error.
          minLength: 1
      additionalProperties: false
      required:
        - location
        - path
        - code
        - message
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              enum:
                - invalid_request
                - validation_failed
                - authentication_required
                - invalid_credentials
                - origin_not_allowed
                - csrf_validation_failed
                - permission_denied
                - not_found
                - version_conflict
                - precondition_required
                - state_conflict
                - payload_too_large
                - unsupported_media_type
                - rate_limited
                - internal_error
                - service_unavailable
                - idempotency_key_reused
                - email_in_use
                - email_domain_not_allowed
                - verification_token_invalid
                - verification_token_used
                - weak_password
                - reset_token_invalid
                - reset_token_used
                - course_archived
                - course_deleting
                - already_member
                - invalid_join_code
                - last_instructor
                - answer_endorsed
                - not_a_question
                - not_a_poll
                - poll_closed
                - poll_option_invalid
                - resource_not_ready
                - parent_archived
                - session_ended
                - cross_course_anchor
            message:
              type: string
              description: Human-readable summary of the error.
              minLength: 1
            requestId:
              type: string
              description: Identifier used to correlate the failure with server logs.
              minLength: 1
            details:
              type: array
              items:
                "$ref": "#/components/schemas/ErrorDetail"
              description: Specific request-value errors; empty when the error is not field-specific.
          additionalProperties: false
          required:
            - code
            - message
            - requestId
            - details
      additionalProperties: false
      required:
        - error
    Page:
      type: object
      properties:
        nextCursor:
          type:
            - string
            - "null"
          description: Opaque cursor for the next page, or null when this is the final page.
        hasMore:
          type: boolean
          description: Whether another page exists.
      additionalProperties: false
      required:
        - nextCursor
        - hasMore
    Author:
      type: object
      description: Viewer-aware identity projection. Anonymous authors are visible to staff and themselves, hidden as Anonymous from other students, and deleted authors appear as Deleted user while retaining the content's original anonymity value.
      properties:
        userId:
          type:
            - string
            - "null"
          description: Author identifier; null when identity is hidden from this viewer or the account is deleted.
        displayName:
          type: string
          description: Visible author name or the value Anonymous/Deleted user.
          minLength: 1
          maxLength: 100
        anonymous:
          type: boolean
          description: Whether the content was authored anonymously. Visibility still depends on the authenticated viewer.
        deleted:
          type: boolean
          description: Whether the author account has been deleted.
      additionalProperties: false
      required:
        - userId
        - displayName
        - anonymous
        - deleted
    UserSummary:
      type: object
      properties:
        id:
          type: string
          description: Opaque stable identifier.
          minLength: 1
          maxLength: 255
          examples:
            - 01J8Z5M6N7P8Q9R0S1T2V3W4X5
        displayName:
          type: string
          description: Visible account name.
          minLength: 1
          maxLength: 100
      additionalProperties: false
      required:
        - id
        - displayName
    User:
      type: object
      properties:
        id:
          type: string
          description: Opaque stable identifier.
          minLength: 1
          maxLength: 255
          examples:
            - 01J8Z5M6N7P8Q9R0S1T2V3W4X5
        email:
          type: string
          description: Account email address.
          format: email
        displayName:
          type: string
          description: Visible account name.
          minLength: 1
          maxLength: 100
        notificationEmails:
          type: boolean
          description: Legacy account activity-email choice retained for migration only; per-course membership preferences now control delivery.
          deprecated: true
        createdAt:
          type: string
          description: UTC timestamp in ISO 8601 date-time format.
          format: date-time
          examples:
            - "2026-09-20T14:30:00Z"
        updatedAt:
          type: string
          description: UTC timestamp in ISO 8601 date-time format.
          format: date-time
          examples:
            - "2026-09-20T14:30:00Z"
        version:
          type: integer
          description: Revision number used to construct the resource ETag.
          minimum: 1
          examples:
            - 3
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - notificationEmails
        - createdAt
        - updatedAt
        - version
    OrganizationSummary:
      type: object
      properties:
        id:
          type: string
          description: Opaque stable identifier.
          minLength: 1
          maxLength: 255
          examples:
            - 01J8Z5M6N7P8Q9R0S1T2V3W4X5
        name:
          type: string
          description: Human-readable title.
          minLength: 1
          maxLength: 200
        createdAt:
          type: string
          description: UTC timestamp in ISO 8601 date-time format.
          format: date-time
          examples:
            - "2026-09-20T14:30:00Z"
        updatedAt:
          type: string
          description: UTC timestamp in ISO 8601 date-time format.
          format: date-time
          examples:
            - "2026-09-20T14:30:00Z"
        version:
          type: integer
          description: Revision number used to construct the resource ETag.
          minimum: 1
          examples:
            - 3
      additionalProperties: false
      required:
        - id
        - name
        - createdAt
        - updatedAt
        - version
    CourseSummary:
      type: object
      properties:
        id:
          type: string
          description: Opaque stable identifier.
          minLength: 1
          maxLength: 255
          examples:
            - 01J8Z5M6N7P8Q9R0S1T2V3W4X5
        organizationId:
          type: string
          description: Opaque stable identifier.
          minLength: 1
          maxLength: 255
          examples:
            - 01J8Z5M6N7P8Q9R0S1T2V3W4X5
        name:
          type: string
          description: Human-readable title.
          minLength: 1
          maxLength: 200
        status:
          type: string
          description: Course lifecycle state.
          enum:
            - active
            - archived
            - deleting
        createdAt:
          type: string
          description: UTC timestamp in ISO 8601 date-time format.
          format: date-time
          examples:
            - "2026-09-20T14:30:00Z"
        updatedAt:
          type: string
          description: UTC timestamp in ISO 8601 date-time format.
          format: date-time
          examples:
            - "2026-09-20T14:30:00Z"
        version:
          type: integer
          description: Revision number used to construct the resource ETag.
          minimum: 1
          examples:
            - 3
      additionalProperties: false
      required:
        - id
        - organizationId
        - name
        - status
        - createdAt
        - updatedAt
        - version
    Course:
      type: object
      properties:
        id:
          type: string
          description: Opaque stable identifier.
          minLength: 1
          maxLength: 255
          examples:
            - 01J8Z5M6N7P8Q9R0S1T2V3W4X5
        organizationId:
          type: string
          description: Opaque stable identifier.
          minLength: 1
          maxLength: 255
          examples:
            - 01J8Z5M6N7P8Q9R0S1T2V3W4X5
        name:
          type: string
          description: Human-readable title.
          minLength: 1
          maxLength: 200
        status:
          type: string
          description: Course lifecycle state.
          enum:
            - active
            - archived
            - deleting
        createdAt:
          type: string
          description: UTC timestamp in ISO 8601 date-time format.
          format: date-time
          examples:
            - "2026-09-20T14:30:00Z"
        updatedAt:
          type: string
          description: UTC timestamp in ISO 8601 date-time format.
          format: date-time
          examples:
            - "2026-09-20T14:30:00Z"
        version:
          type: integer
          description: Revision number used to construct the resource ETag.
          minimum: 1
          examples:
            - 3
        joinCode:
          type:
            - string
            - "null"
