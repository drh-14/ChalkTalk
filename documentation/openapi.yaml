              example:
                data:
                  courseId: course_123
                  period: 30d
                  dailyActivity:
                    - date: "2026-09-19"
                      questionsCreated: 5
                      answersCreated: 4
                      postsViewed: 86
                    - date: "2026-09-20"
                      questionsCreated: 3
                      answersCreated: 6
