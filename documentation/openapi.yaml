  /posts/{postId}/attachments:
    post:
      tags: [Posts]
      summary: Upload one file to a saved question or note
      description: Requires current parent edit permission and an active course. Matching-byte Idempotency-Key retries return the original 201 for 24 hours, including after archive while the caller remains authorized. Conflicting reuse returns 409. At most five live files per parent; each validated file is at most 100 MiB. Text is saved separately through JSON REST requests.
      security: [{ session_cookie: [] }]
      parameters:
        - {
            name: postId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: Idempotency-Key,
            in: header,
            required: false,
            schema: { type: string, minLength: 1, maxLength: 255 },
          }
        - { name: Origin, in: header, required: true, schema: { type: string } }
        - {
            name: X-CSRF-Token,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              {
                type: object,
                properties: { file: { type: string, format: binary } },
                required: [file],
                additionalProperties: false,
              }
      responses:
        "201":
          {
            description: Created or exact-byte replay; Location is the authenticated download path.,
            headers: { Location: { schema: { type: string } } },
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties:
                          { data: { $ref: "#/components/schemas/Attachment" } },
                        required: [data],
                      },
                  },
              },
          }
        "403": { description: Parent edit permission denied. }
        "404": { description: Parent not found or not visible. }
        "409":
          {
            description: Course archived for new upload,
            or idempotency key reused with different request.,
          }
        "413":
          {
            description: File exceeds 100 MiB or parent already has five live files.,
          }
        "415":
          {
            description: Multipart required or file format or structure unsupported.,
          }
        "422": { description: Invalid key, filename, or multipart parts. }
        "503": { description: Attachment storage unavailable. }
