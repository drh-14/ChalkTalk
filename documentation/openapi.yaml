                  data: { $ref: "#/components/schemas/Answer" }
        "403": { description: Staff role required. }
        "404": { description: Resource hidden or revision foreign or missing. }
        "409": { description: Course archived. }
        "412": { description: Stale If-Match. }
        "428": { description: If-Match required. }
  "/followups/{followupId}/revisions":
    get:
      tags: [Answers]
      summary: List followup text revisions
      operationId: listFollowupTextRevisions
