<svg xmlns="http://www.w3.org/2000/svg" width="597.024" height="356" viewBox="0 0 597.024 356" style="--bg:#000000;--fg:#FFFFFF;--line:#FFFFFF;--accent:#000000;--surface:#000000;--border:#FFFFFF;--font:Inter;background:#000000">
<style>
  text { font-family: var(--font, 'Inter'), system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #FFFFFF;
    --_text-sec:      #c7c7c7;
    --_text-muted:    #a8a8a8;
    --_text-faint:    #8a8a8a;
    --_line:          #FFFFFF;
    --_arrow:         #000000;
    --_node-fill:     #000000;
    --_node-stroke:   #FFFFFF;
    --_group-fill:    #000000;
    --_group-hdr:     #0d0d0d;
    --_inner-stroke:  #1f1f1f;
    --_key-badge:     #1a1a1a;
  }
</style>
<defs>
