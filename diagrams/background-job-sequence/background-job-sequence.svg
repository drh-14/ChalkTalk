    <path d="M1 1 L7 4 M1 4 L7 1" fill="none" stroke="#5a5a5a" stroke-width="1.5" />
  </marker>
  <marker id="seq-arrow-half-top" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <path d="M0 0 L8 2.5" fill="none" stroke="#5a5a5a" stroke-width="1" />
  </marker>
  <marker id="seq-arrow-half-bottom" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <path d="M0 5 L8 2.5" fill="none" stroke="#5a5a5a" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="WebServer" x1="107.737" y1="70" x2="107.737" y2="326" stroke="#FFFFFF" stroke-width="0.75" stroke-dasharray="6 4" data-relationship="lifeline" data-direction="undirected" />
