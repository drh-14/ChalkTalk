    <polygon points="0 0, 8 2.5, 0 5" fill="#5a5a5a" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="#5a5a5a" stroke-width="1" />
  </marker>
