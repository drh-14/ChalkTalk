<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1050" viewBox="0 0 1560 1050" role="img" aria-labelledby="title description">
  <title id="title">ChalkTalk architecture</title>
  <desc id="description">A frontend centered above a backend containing a web server, collaboration engine, and worker. Seven labeled, bent arrows connect backend processes to a centered bottom row of PostgreSQL, Redis, object storage, and email services.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 2.5; }
    .wire { fill: none; stroke: #475569; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .caption { fill: #334155; font: 17px Arial, Helvetica, sans-serif; text-anchor: middle; paint-order: stroke; stroke: white; stroke-width: 9px; stroke-linejoin: round; }
    .title { font: 600 24px Arial, Helvetica, sans-serif; text-anchor: middle; }
    .subtitle { font: 21px Arial, Helvetica, sans-serif; text-anchor: middle; }
  </style>
  <rect width="1560" height="1050" fill="white"/>

  <rect class="box" x="160" y="290" width="1240" height="265" rx="5" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="195" y="326" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Backend (Docker / AWS ECS)</text>

  <!-- Keep the original connections, captions, and right-angle routing. -->
  <g aria-label="Connections">
    <path class="wire" d="M 700 145 L 700 210 Q 700 220 690 220 L 390 220 Q 380 220 380 230 L 380 370"/>
    <path class="wire" d="M 860 145 L 860 240 Q 860 250 850 250 L 790 250 Q 780 250 780 260 L 780 370"/>
    <path class="wire" d="M 330 500 L 330 645 Q 330 655 320 655 L 240 655 L 240 855"/>
    <path class="wire" d="M 430 500 L 430 590 Q 430 600 440 600 L 950 600 Q 960 600 960 610 L 960 855"/>
    <path class="wire" d="M 720 500 L 720 675 Q 720 685 710 685 L 300 685 L 300 855"/>
    <path class="wire" d="M 820 500 L 820 700 Q 820 710 810 710 L 600 710 L 600 855"/>
    <path class="wire" d="M 1110 500 L 1110 625 Q 1110 635 1100 635 L 350 635 L 350 855"/>
    <path class="wire" d="M 1180 500 L 1180 725 Q 1180 735 1170 735 L 1040 735 L 1040 855"/>
    <path class="wire" d="M 1250 500 L 1250 670 Q 1250 680 1260 680 L 1320 680 L 1320 855"/>
  </g>

  <rect class="box" x="600" y="40" width="360" height="105" rx="5" fill="#DBEAFE" stroke="#2563EB"/>
  <text class="title" x="780" y="86" fill="#1E3A8A">Frontend (Docker / Vercel)</text>
  <text class="subtitle" x="780" y="121" fill="#1E3A8A">React + Vite</text>

  <rect class="box" x="230" y="370" width="300" height="130" rx="5" fill="#FFEDD5" stroke="#EA580C"/>
  <text class="title" x="380" y="424" fill="#7C2D12">Web server</text>
  <text class="subtitle" x="380" y="462" fill="#7C2D12">Express.js HTTP API</text>
  <rect class="box" x="630" y="370" width="300" height="130" rx="5" fill="#FFEDD5" stroke="#EA580C"/>
  <text class="title" x="780" y="424" fill="#7C2D12">Collaboration engine</text>
  <text class="subtitle" x="780" y="462" fill="#7C2D12">Yjs + Hocuspocus</text>
  <rect class="box" x="1030" y="370" width="300" height="130" rx="5" fill="#FFEDD5" stroke="#EA580C"/>
  <text class="title" x="1180" y="424" fill="#7C2D12">Worker</text>
  <text class="subtitle" x="1180" y="462" fill="#7C2D12">Node.js process</text>

  <text class="caption" x="380" y="277">HTTPS (REST)</text>
  <text class="caption" x="780" y="278">WebSocket</text>
  <text class="caption" x="200" y="740"><tspan x="200">read/write data</tspan><tspan x="200" dy="23">queue jobs</tspan></text>
  <text class="caption" x="855" y="590">upload/fetch files</text>
  <text class="caption" x="405" y="733"><tspan x="405">load/save Yjs</tspan><tspan x="405" dy="23">documents</tspan></text>
  <text class="caption" x="600" y="778">relay live updates</text>
  <text class="caption" x="625" y="626"><tspan x="625">claim jobs</tspan><tspan x="625" dy="23">update data</tspan></text>
  <text class="caption" x="1040" y="780"><tspan x="1040">read files</tspan><tspan x="1040" dy="23">for OCR</tspan></text>
  <text class="caption" x="1320" y="778">send emails</text>

  <rect class="box" x="80" y="855" width="320" height="145" rx="5" fill="#F3E8FF" stroke="#9333EA"/>
  <text class="title" x="240" y="912" fill="#581C87">Application Database</text>
  <text class="subtitle" x="240" y="954" fill="#581C87">PostgreSQL / AWS RDS</text>
  <rect class="box" x="440" y="855" width="320" height="145" rx="5" fill="#CFFAFE" stroke="#0891B2"/>
  <text class="title" x="600" y="912" fill="#164E63">Collaboration Relay</text>
  <text class="subtitle" x="600" y="954" fill="#164E63">Redis</text>
  <rect class="box" x="800" y="855" width="320" height="145" rx="5" fill="#DCFCE7" stroke="#16A34A"/>
  <text class="title" x="960" y="912" fill="#14532D">Object Store</text>
  <text class="subtitle" x="960" y="954" fill="#14532D">SeaweedFS / AWS S3</text>
  <rect class="box" x="1160" y="855" width="320" height="145" rx="5" fill="#F1F5F9" stroke="#64748B"/>
  <text class="title" x="1320" y="912" fill="#334155">Email Provider</text>
  <text class="subtitle" x="1320" y="954" fill="#334155">SMTP Server / AWS SES</text>
</svg>
