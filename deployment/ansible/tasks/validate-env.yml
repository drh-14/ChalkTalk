---
- name: Validate production environment values
  ansible.builtin.assert:
    that:
      - item.value is string
      - item.value | length > 0
      - "'replace-with-' not in item.value"
      - "'\\n' not in item.value"
      - "'\\r' not in item.value"
      - "'${' not in item.value"
      - "'\\\\' not in item.value"
    fail_msg: A required production environment value is missing or invalid.
  loop: "{{ bootstrap_environment | dict2items }}"
  no_log: true

- name: Validate domain and session secret
  ansible.builtin.assert:
    that:
      - bootstrap_domain is match('^[A-Za-z0-9.-]+$')
      - bootstrap_auth_token_secret | length >= 32
      - bootstrap_ssh_port >= 1
      - bootstrap_ssh_port <= 65535
    fail_msg: Production domain, session secret, or SSH port is invalid.
  no_log: true
