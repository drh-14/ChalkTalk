---
- name: Exercise production env template without touching the VM
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    bootstrap_environment_dest: "{{ output_path }}"
    bootstrap_environment_template: "{{ playbook_dir }}/../templates/production.env.j2"
    bootstrap_domain: "{{ lookup('ansible.builtin.env', 'DOMAIN') }}"
    bootstrap_auth_token_secret: "{{ lookup('ansible.builtin.env', 'AUTH_TOKEN_SECRET') }}"
    bootstrap_metrics_token: "{{ lookup('ansible.builtin.env', 'METRICS_TOKEN') }}"
    bootstrap_grafana_admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}"
    bootstrap_environment:
      DOMAIN: "{{ lookup('ansible.builtin.env', 'DOMAIN') }}"
      DATABASE_URL: "{{ lookup('ansible.builtin.env', 'DATABASE_URL') }}"
      SUPABASE_STORAGE_ENDPOINT: "{{ lookup('ansible.builtin.env', 'SUPABASE_STORAGE_ENDPOINT') }}"
      SUPABASE_STORAGE_BUCKET: "{{ lookup('ansible.builtin.env', 'SUPABASE_STORAGE_BUCKET') }}"
      SUPABASE_STORAGE_REGION: "{{ lookup('ansible.builtin.env', 'SUPABASE_STORAGE_REGION') }}"
      SUPABASE_STORAGE_ACCESS_KEY_ID: "{{ lookup('ansible.builtin.env', 'SUPABASE_STORAGE_ACCESS_KEY_ID') }}"
      SUPABASE_STORAGE_SECRET_ACCESS_KEY: "{{ lookup('ansible.builtin.env', 'SUPABASE_STORAGE_SECRET_ACCESS_KEY') }}"
      AUTH_TOKEN_SECRET: "{{ lookup('ansible.builtin.env', 'AUTH_TOKEN_SECRET') }}"
      RESEND_API_KEY: "{{ lookup('ansible.builtin.env', 'RESEND_API_KEY') }}"
      METRICS_TOKEN: "{{ bootstrap_metrics_token }}"
    bootstrap_grafana_environment:
      GRAFANA_ADMIN_PASSWORD: "{{ bootstrap_grafana_admin_password }}"
  pre_tasks:
    - name: Validate fake production configuration
      ansible.builtin.import_tasks: ../tasks/validate-env.yml
      when: validate_environment | default(true) | bool
  tasks:
    - name: Render fake environment fixture
      ansible.builtin.import_tasks: ../tasks/render-env.yml

    - name: Render fake Grafana environment fixture
      ansible.builtin.import_tasks: ../tasks/render-env.yml
      vars:
        bootstrap_environment: "{{ bootstrap_grafana_environment }}"
        bootstrap_environment_dest: "{{ output_path | dirname }}/grafana.env"
