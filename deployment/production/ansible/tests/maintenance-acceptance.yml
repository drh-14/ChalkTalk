---
- name: Apply maintenance policy to disposable Ubuntu guest
  hosts: all
  gather_facts: true
  vars:
    maintenance_source_root: "{{ playbook_dir }}/../../maintenance"
    maintenance_template_root: "{{ playbook_dir }}/../templates"
  tasks:
    - name: Create disposable bootstrap identity
      ansible.builtin.user:
        name: ubuntu
        state: present
    - name: Establish bootstrap hold before applying maintenance
      ansible.builtin.import_tasks: ../tasks/maintenance-prepare.yml
    - name: Observe bootstrap hold before package work
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "from pathlib import Path; import sys; sys.exit(Path('/var/lib/chalktalk-maintenance/bootstrap.hold').read_text().strip() != sys.argv[1])"
          - "{{ maintenance_bootstrap_token.stdout }}"
      changed_when: false
    - name: Verify both stock APT starts honor bootstrap hold before package work
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        import subprocess

        state = Path('/var/lib/chalktalk-maintenance')
        periodic = Path('/var/lib/apt/periodic')
        lists = Path('/var/lib/apt/lists')
        watched = [Path('/var/lib/dpkg/status'), periodic / 'update-stamp',
                   periodic / 'upgrade-stamp', *lists.glob('*')]
        def snapshot():
            return {str(path): (path.stat().st_size, path.stat().st_mtime_ns)
                    for path in watched if path.is_file()}
        before = snapshot()
        for service, mode in (('apt-daily.service', 'update'),
                              ('apt-daily-upgrade.service', 'install')):
            subprocess.run(['systemctl', 'start', service], check=True)
            evidence = json.loads((state / (mode + '.json')).read_text())
            assert evidence['disposition'] == 'held', (service, evidence)
            assert evidence['last_success'] is None, (service, evidence)
        assert snapshot() == before, 'APT metadata or package state changed under bootstrap hold'
        PY
      args:
        executable: /bin/bash
      changed_when: false
    - name: Apply managed security maintenance
      ansible.builtin.import_tasks: ../tasks/maintenance.yml
    - name: Clear only owned fixture bootstrap hold
      ansible.builtin.command:
        argv:
          - /usr/local/lib/chalktalk-maintenance/hold.sh
          - clear
          - bootstrap
          - "{{ maintenance_bootstrap_token.stdout }}"
      changed_when: false
