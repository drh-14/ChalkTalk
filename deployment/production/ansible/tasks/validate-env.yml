---
- name: Validate production environment values
  ansible.builtin.assert:
    that:
      - item.value is string
      - item.value | length > 0
      - "'replace-with-' not in item.value"
      - "'\\n' not in item.value"
      - "'\\r' not in item.value"
      - "'${' not in item.value"
      - "'\\\\' not in item.value"
    fail_msg: A required production environment value is missing or invalid.
  loop: "{{ (bootstrap_environment | combine(bootstrap_grafana_environment)) | dict2items }}"
  no_log: true

- name: Validate domain and session secret
  ansible.builtin.assert:
    that:
      - bootstrap_domain | length <= 253
      - bootstrap_domain is match('^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$')
      - bootstrap_auth_token_secret | length >= 32
      - bootstrap_metrics_token | length >= 32
      - bootstrap_grafana_admin_password | length >= 32
    fail_msg: Production domain or secret is invalid or too short.
  no_log: true
