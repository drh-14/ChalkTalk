name: chalktalk

x-api-build: &api-build
  context: ../..
  dockerfile: deployment/production/Dockerfile.api

x-app-environment: &app-environment
  env_file: ${COMPOSE_ENV_FILE:-.env}
  environment:
    COLLABORATION_PORT: "3100"
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?Set the Supabase DATABASE_URL in /srv/chalktalk/shared/production.env}
    SUPABASE_STORAGE_ENDPOINT: ${SUPABASE_STORAGE_ENDPOINT:?Set SUPABASE_STORAGE_ENDPOINT in /srv/chalktalk/shared/production.env}
    SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:?Set the private SUPABASE_STORAGE_BUCKET in /srv/chalktalk/shared/production.env}
    SUPABASE_STORAGE_REGION: ${SUPABASE_STORAGE_REGION:?Set SUPABASE_STORAGE_REGION in /srv/chalktalk/shared/production.env}
    SUPABASE_STORAGE_ACCESS_KEY_ID: ${SUPABASE_STORAGE_ACCESS_KEY_ID:?Set the server-only SUPABASE_STORAGE_ACCESS_KEY_ID}
    SUPABASE_STORAGE_SECRET_ACCESS_KEY: ${SUPABASE_STORAGE_SECRET_ACCESS_KEY:?Set the server-only SUPABASE_STORAGE_SECRET_ACCESS_KEY}
    RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in /srv/chalktalk/shared/production.env}
    FRONTEND_ORIGINS: https://${DOMAIN:?Set DOMAIN in /srv/chalktalk/shared/production.env}
    FRONTEND_BASE_URL: https://${DOMAIN:?Set DOMAIN in /srv/chalktalk/shared/production.env}
    COLLABORATION_PUBLIC_URL: wss://${DOMAIN:?Set DOMAIN in /srv/chalktalk/shared/production.env}/collaboration
    TRUST_PROXY_HOPS: "1"
    METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in /srv/chalktalk/shared/production.env}
    LOG_SPOOL_DIRECTORY: /var/log/chalktalk

x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  migrate:
    image: chalktalk-api:local
    build: *api-build
    <<: *app-environment
    command: ["node", "apps/api/dist/database/migrate.js"]
    restart: "no"
    networks: [edge]
    logging: *bounded-logs

  api:
    image: chalktalk-api:local
    build: *api-build
    <<: *app-environment
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [edge]
    volumes:
      - api-log-spool:/var/log/chalktalk
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *bounded-logs

  worker:
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile.worker
    <<: *app-environment
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [edge]
    volumes:
      - worker-log-spool:/var/log/chalktalk
    logging: *bounded-logs

  collaboration:
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile.collaboration
    <<: *app-environment
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [edge]
    logging: *bounded-logs

  web:
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile.frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in /srv/chalktalk/shared/production.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      collaboration: { condition: service_started }
    networks: [edge]
    logging: *bounded-logs

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    restart: unless-stopped
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [edge]
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/loki",
          "-verify-config",
          "-config.file=/etc/loki/loki.yml",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *bounded-logs

  alloy:
    image: grafana/alloy:v1.9.2
    command:
      ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    restart: unless-stopped
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - api-log-spool:/var/log/chalktalk-api:ro
      - worker-log-spool:/var/log/chalktalk-worker:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki: { condition: service_started }
    networks: [edge]
    logging: *bounded-logs

  prometheus:
    image: prom/prometheus:v3.3.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${METRICS_TOKEN}" || { echo 'METRICS_TOKEN is required' >&2; exit 1; }
        printf '%s' "$${METRICS_TOKEN}" > /tmp/metrics-token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in /srv/chalktalk/shared/production.env}
    restart: unless-stopped
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api: { condition: service_healthy }
      worker: { condition: service_started }
      collaboration: { condition: service_started }
    networks: [edge]
    logging: *bounded-logs

  grafana:
    image: grafana/grafana:11.6.1
    env_file: ${GRAFANA_ENV_FILE:-/srv/chalktalk/shared/grafana.env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${GRAFANA_ADMIN_PASSWORD}" || { echo 'GRAFANA_ADMIN_PASSWORD is required' >&2; exit 1; }
        export GF_SECURITY_ADMIN_PASSWORD="$${GRAFANA_ADMIN_PASSWORD}"
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_DISABLE_PLUGINS: grafana-lokiexplore-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - alloy
    networks: [edge]
    logging: *bounded-logs

networks:
  edge: {}

volumes:
  caddy-data: {}
  caddy-config: {}
  api-log-spool: {}
  worker-log-spool: {}
  loki-data: {}
  alloy-data: {}
  prometheus-data: {}
  grafana-data: {}
