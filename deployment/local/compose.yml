name: ${COMPOSE_PROJECT_NAME:-chalktalk}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: chalktalk
      POSTGRES_USER: chalktalk
      POSTGRES_PASSWORD: chalktalk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chalktalk -d chalktalk"]
      interval: 5s
      timeout: 5s
      retries: 10
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-chalktalk-local}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-chalktalk-local-secret}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --show-error --max-time 2 --aws-sigv4 aws:amz:us-east-1:s3 --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" http://127.0.0.1:8333/ > /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: &api-development-build
      context: ../..
      dockerfile: deployment/local/Dockerfile.api
    working_dir: /app
    env_file:
      - ../../${COMPOSE_ENV_FILE:-.env}
    environment: &api-environment
      DATABASE_URL: postgresql://chalktalk:chalktalk@postgres:5432/chalktalk
      FRONTEND_ORIGINS: https://${DOMAIN:-localhost}:${WEB_PORT:-5173}
      FRONTEND_BASE_URL: https://${DOMAIN:-localhost}:${WEB_PORT:-5173}
      NODE_ENV: development
      EMAIL_PROVIDER: resend
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: chalktalk-resources
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-chalktalk-local}
      S3_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-chalktalk-local-secret}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_SPOOL_DIRECTORY: /var/log/chalktalk
    command:
      [
        "sh",
        "-c",
        'if [ "$${PORT+x}" ]; then echo ''Local Compose: remove PORT from .env; the API uses internal port 3000.'' >&2; exit 1; fi; npm run db:migrate && npm run migrate:semantic --workspace=@chalktalk/api',
      ]
    volumes:
      - ../..:/app
      - api-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  api:
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    build: *api-development-build
    working_dir: /app
    env_file:
      - ../../${COMPOSE_ENV_FILE:-.env}
    environment: *api-environment
    command: npm run dev --workspace=@chalktalk/api
    volumes:
      - ../..:/app
      - api-node-modules:/app/node_modules
      - api-log-spool:/var/log/chalktalk
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deployment/local/Dockerfile.worker
    working_dir: /app
    env_file:
      - ../../${COMPOSE_ENV_FILE:-.env}
    environment: *api-environment
    command: npm run dev:worker --workspace=@chalktalk/api
    volumes:
      - ../..:/app
      - worker-node-modules:/app/node_modules
      - worker-log-spool:/var/log/chalktalk
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy

  collaboration:
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deployment/local/Dockerfile.collaboration
    working_dir: /app
    env_file:
      - ../../${COMPOSE_ENV_FILE:-.env}
    environment: *api-environment
    command: npm run dev:collab --workspace=@chalktalk/api
    volumes:
      - ../..:/app
      - collaboration-node-modules:/app/node_modules
    expose:
      - "3100"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: deployment/local/Dockerfile.frontend
    working_dir: /app
    env_file:
      - ../../${COMPOSE_ENV_FILE:-.env}
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      VITE_COLLABORATION_PROXY_TARGET: ws://collaboration:3100
      VITE_TLS_KEY_PATH: /certificates/localhost-key.pem
      VITE_TLS_CERT_PATH: /certificates/localhost.pem
      VITE_USE_POLLING: "true"
    command: npm run dev --workspace=@chalktalk/web -- --host 0.0.0.0
    volumes:
      - ../..:/app
      - web-node-modules:/app/node_modules
      - ../../.cert:/certificates:ro
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The CI certificate is intentionally self-signed. Limit TLS verification
      # bypassing to this internal readiness probe; browser traffic still uses
      # the mounted mkcert certificate.
      test:
        [
          "CMD",
          "node",
          "-e",
          "const https = require('node:https'); const request = https.get('https://localhost:5173/api/health', { rejectUnauthorized: false }, (response) => { response.resume(); response.on('end', () => process.exit(response.statusCode === 200 ? 0 : 1)); }); request.on('error', () => process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/loki",
          "-verify-config",
          "-config.file=/etc/loki/loki.yml",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  alloy:
    image: grafana/alloy:v1.9.2
    command:
      ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - api-log-spool:/var/log/chalktalk-api:ro
      - worker-log-spool:/var/log/chalktalk-worker:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.3.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${METRICS_TOKEN}" || { echo 'METRICS_TOKEN is required' >&2; exit 1; }
        printf '%s' "$${METRICS_TOKEN}" > /tmp/metrics-token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      collaboration:
        condition: service_started

  grafana:
    image: grafana/grafana:11.6.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo 'GRAFANA_ADMIN_PASSWORD is required' >&2; exit 1; }
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_DISABLE_PLUGINS: grafana-lokiexplore-app
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - alloy

volumes:
  postgres-data:
  seaweedfs-data:
  api-node-modules:
  worker-node-modules:
  collaboration-node-modules:
  web-node-modules:
  api-log-spool:
  worker-log-spool:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
