name: chalktalk

services:
  migrate:
    build: &api-development-build
      context: ../..
      dockerfile: deployment/local/Dockerfile.api
    working_dir: /app
    env_file:
      - path: ${LOCAL_APPLICATION_ENV_FILE:?Use deployment/local/start.sh}
        format: raw
    environment: &api-environment
      NODE_ENV: development
    command: ["node", "--import", "tsx", "deployment/local/runtime.ts"]
    volumes:
      - ../..:/app
      - api-node-modules:/app/node_modules

  api:
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    build: *api-development-build
    working_dir: /app
    env_file:
      - path: ${LOCAL_APPLICATION_ENV_FILE:?Use deployment/local/start.sh}
        format: raw
    environment: *api-environment
    command: npm run dev --workspace=@chalktalk/api
    volumes:
      - ../..:/app
      - api-node-modules:/app/node_modules
      - api-log-spool:/var/log/chalktalk
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deployment/local/Dockerfile.worker
    working_dir: /app
    env_file:
      - path: ${LOCAL_APPLICATION_ENV_FILE:?Use deployment/local/start.sh}
        format: raw
    environment: *api-environment
    command: npm run dev:worker --workspace=@chalktalk/api
    volumes:
      - ../..:/app
      - worker-node-modules:/app/node_modules
      - worker-log-spool:/var/log/chalktalk
    expose:
      - "3000"

  collaboration:
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deployment/local/Dockerfile.collaboration
    working_dir: /app
    env_file:
      - path: ${LOCAL_APPLICATION_ENV_FILE:?Use deployment/local/start.sh}
        format: raw
    environment: *api-environment
    command: npm run dev:collab --workspace=@chalktalk/api
    volumes:
      - ../..:/app
      - collaboration-node-modules:/app/node_modules
    expose:
      - "3100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      # A fresh development volume installs dependencies before the listener starts.
      start_period: 120s

  web:
    build:
      context: ../..
      dockerfile: deployment/local/Dockerfile.frontend
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      VITE_COLLABORATION_PROXY_TARGET: ws://collaboration:3100
      VITE_TLS_KEY_PATH: ""
      VITE_TLS_CERT_PATH: ""
      VITE_GATEWAY_DOMAIN: ${DOMAIN:-localhost}
      VITE_GATEWAY_PORT: ${WEB_PORT:-5173}
      VITE_USE_POLLING: "true"
    command: npm run dev --workspace=@chalktalk/web -- --host 0.0.0.0
    volumes:
      - ../..:/app
      - web-node-modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  gateway:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${WEB_PORT:-5173}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy
      # A running collaboration container may not yet accept WebSocket upgrades.
      collaboration:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/loki",
          "-verify-config",
          "-config.file=/etc/loki/loki.yml",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  alloy:
    image: grafana/alloy:v1.9.2
    command:
      ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - api-log-spool:/var/log/chalktalk-api:ro
      - worker-log-spool:/var/log/chalktalk-worker:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    expose: ["9100"]

  node-exporter-network:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc/1
      - --collector.disable-defaults
      - --collector.netdev
      - --no-collector.netdev.netlink
    pid: host
    volumes:
      - /proc:/host/proc:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    expose: ["9100"]

  prometheus:
    image: prom/prometheus:v3.3.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${METRICS_TOKEN}" || { echo 'METRICS_TOKEN is required' >&2; exit 1; }
        printf '%s' "$${METRICS_TOKEN}" > /tmp/metrics-token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      collaboration:
        condition: service_started
      node-exporter:
        condition: service_started
      node-exporter-network:
        condition: service_started

  grafana:
    image: grafana/grafana:11.6.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo 'GRAFANA_ADMIN_PASSWORD is required' >&2; exit 1; }
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_DISABLE_PLUGINS: grafana-lokiexplore-app
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../observability/grafana/load-test-dashboards:/var/lib/grafana/load-test-dashboards:ro
    depends_on:
      - prometheus
      - loki
      - alloy

volumes:
  postgres-data:
  seaweedfs-data:
  api-node-modules:
  worker-node-modules:
  collaboration-node-modules:
  web-node-modules:
  caddy-data:
  api-log-spool:
  worker-log-spool:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
