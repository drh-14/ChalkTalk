global:
  scrape_interval: 60s
  evaluation_interval: 60s
scrape_configs:
  - job_name: chalktalk-api
    metrics_path: /metrics
    bearer_token_file: /tmp/metrics-token
    static_configs:
      - targets: [api:3000]
  - job_name: chalktalk-worker
    metrics_path: /metrics
    bearer_token_file: /tmp/metrics-token
    static_configs:
      - targets: [worker:3000]
  - job_name: chalktalk-collaboration
    metrics_path: /metrics
    bearer_token_file: /tmp/metrics-token
    static_configs:
      - targets: [collaboration:3100]
  - job_name: chalktalk-vm
    metrics_path: /metrics
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: chalktalk-vm-network
    metrics_path: /metrics
    static_configs:
      - targets: [node-exporter-network:9100]
