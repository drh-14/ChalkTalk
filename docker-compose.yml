services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chalktalk
      POSTGRES_USER: chalktalk
      POSTGRES_PASSWORD: chalktalk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
