services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chalktalk
      POSTGRES_USER: chalktalk
      POSTGRES_PASSWORD: chalktalk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chalktalk -d chalktalk"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-chalktalk-local}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-chalktalk-local-secret}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --show-error --max-time 2 --aws-sigv4 aws:amz:us-east-1:s3 --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" http://127.0.0.1:8333/ > /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    profiles: ["app"]
    build: &development-build
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment: &api-environment
      DATABASE_URL: postgresql://chalktalk:chalktalk@postgres:5432/chalktalk
      PORT: "3000"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: chalktalk-resources
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID:-chalktalk-local}
      S3_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY:-chalktalk-local-secret}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_SPOOL_DIRECTORY: /var/log/chalktalk
    command: npm run db:migrate
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    build: *development-build
    working_dir: /app
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment: *api-environment
    command: npm run dev --workspace=@chalktalk/api
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
      - api-log-spool:/var/log/chalktalk
    expose:
      - "3000"
    depends_on:
      seed-mock:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    profiles: ["app"]
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    build: *development-build
    working_dir: /app
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment: *api-environment
    command: npm run dev:worker --workspace=@chalktalk/api
    volumes:
      - .:/app
      - worker-node-modules:/app/node_modules
      - worker-log-spool:/var/log/chalktalk
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy

  seed-mock:
    profiles: ["app"]
    build: *development-build
    working_dir: /app
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment: *api-environment
    command: npm run db:seed:mock
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["app"]
    build: *development-build
    working_dir: /app
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      VITE_TLS_KEY_PATH: /certificates/localhost-key.pem
      VITE_TLS_CERT_PATH: /certificates/localhost.pem
      VITE_USE_POLLING: "true"
    command: npm run dev --workspace=@chalktalk/web -- --host 0.0.0.0
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
      - ./.cert:/certificates:ro
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The CI certificate is intentionally self-signed. Limit TLS verification
      # bypassing to this internal readiness probe; browser traffic still uses
      # the mounted mkcert certificate.
      test:
        [
          "CMD",
          "node",
          "-e",
          "const https = require('node:https'); const request = https.get('https://localhost:5173/api/health', { rejectUnauthorized: false }, (response) => { response.resume(); response.on('end', () => process.exit(response.statusCode === 200 ? 0 : 1)); }); request.on('error', () => process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  elasticsearch:
    profiles: ["observability"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  elasticsearch-init:
    profiles: ["observability"]
    image: curlimages/curl:8.15.0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl -fsS -X PUT http://elasticsearch:9200/_ilm/policy/chalktalk-local-7d -H 'Content-Type: application/json' --data '{"policy":{"phases":{"delete":{"min_age":"7d","actions":{"delete":{}}}}}}'
        curl -fsS -X PUT http://elasticsearch:9200/_index_template/chalktalk-logs -H 'Content-Type: application/json' --data-binary @/config/elasticsearch-template.json
    volumes:
      - ./docker/observability/elasticsearch-template.json:/config/elasticsearch-template.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    profiles: ["observability"]
    image: docker.elastic.co/logstash/logstash:8.17.6
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./docker/observability/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./docker/observability/logstash/pipeline.conf:/usr/share/logstash/pipeline/pipeline.conf:ro
      - api-log-spool:/var/log/chalktalk-api:ro
      - worker-log-spool:/var/log/chalktalk-worker:ro
      - logstash-data:/usr/share/logstash/data
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.3.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${METRICS_TOKEN}" || { echo 'METRICS_TOKEN is required' >&2; exit 1; }
        printf '%s' "$${METRICS_TOKEN}" > /tmp/metrics-token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.6.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo 'GRAFANA_ADMIN_PASSWORD is required' >&2; exit 1; }
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_DISABLE_PLUGINS: grafana-lokiexplore-app
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - elasticsearch-init

volumes:
  postgres-data:
  seaweedfs-data:
  api-node-modules:
  worker-node-modules:
  web-node-modules:
  api-log-spool:
  worker-log-spool:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  logstash-data:
